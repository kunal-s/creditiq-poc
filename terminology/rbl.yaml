  bank:
    name: RBL Bank
    unit: Business Banking Group
    emailDomain: rblbank.com
  brand:
    mark: CI
  product:
    name: CreditIQ
    documentTitleTemplate: "Credit Workbench — CreditIQ"
    metaDescription: CreditIQ credit workbench

nav:
  group:
    workbench: Workbench
    governance: Governance
    help: Help
    thisCase: "Appraisal {id}"
  help: Guide to the steps
  cases: Appraisals
  newCase: New appraisal
  reviewQueue: Review queue
  scorecard: Scorecard

action:

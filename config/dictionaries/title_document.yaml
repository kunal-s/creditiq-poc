# Field dictionary: title_document (docs/functional-requirements.md F-15).
# key_field: counts towards C3 and is reviewed below threshold (F-17.2).
id: title_document
fields:
- name: document_kind
  label: Kind
  type: text
  description: Sale deed, conveyance or title search report
- name: owner
  label: Owner
  type: text
  key_field: true
- name: property
  label: Property description
  type: text
- name: registration_date
  label: Registration date
  type: date
- name: encumbrances
  label: Encumbrances
  type: table
  key_field: true
  columns:
  - name: beneficiary
    label: In favour of
    type: text
  - name: date
    label: Date
    type: date
  - name: amount
    label: Amount
    type: money_inr

# Policy norms and deviations (F-20): the Policy checks tab, an overview card per family of norms
# and one for the approving authority, then a section per family with its norms, then the
# authority with the matrix's steps.
policy:
  kicker: "Appraisal {id} · Financials and Policy"
  # A ratio's band against its configured acceptable and marginal values (the engine's).
  band:
    within: Within policy
    marginal: Marginal
    outside: Outside policy
  marginalAt: "marginal {value}"
  # A norm's tile: the norm it is held to, under its chip.
  tile:
    required: "Policy: {required}"
  # The financial ratios as one table: each year side by side, and where the latest sits against its limits.
  ratios:
    ratio: Ratio
    policy: Policy
    latest: Latest
    summary: "{within} of {total} within policy"
    summaryOutside: "{n} outside"
    summaryMarginal: "{n} marginal"
    summaryOpen: "{n} cannot be evaluated"
    years: "Years on file: {years}"
    scaleLabel: "Where {value} sits between the limits"
    limits: "{required} · marginal {marginal}"

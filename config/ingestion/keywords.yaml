      - dir-3 kyc
      - kyc of director
      - ckyc
      - know your customer
      - kyc summary sheet
    content:
      - {phrase: director identification number, weight: 2}
      - {phrase: date of birth, weight: 1}
      - residential address
      - {phrase: aadhaar, weight: 1}
      - nationality
      - relationship with company
      - father's name
      - {phrase: din, weight: 1}
    warning:
      - {phrase: certificate of incorporation, zone: title}
  board_resolution:
    title:
      - certified true copy of the resolution
      - board resolution
      - extract of the minutes
      - extract from the minutes
      - resolution passed at the meeting of the board
    content:
      - {phrase: resolved that, weight: 2}
      - {phrase: resolved further that, weight: 2}
      - board of directors
      - {phrase: borrow, weight: 2}

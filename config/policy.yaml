# Credit policy norms: ratio thresholds (docs/functional-requirements.md F-00, F-20).
# Authored here, published as an immutable version by the config writer.
# Runtime code reads only the published copy through
# engine/configstore/reader.py, never this file directly.
#
# Every value below is an interim proposal (source/status "provisional")
# until RBL's own policy norms replace it.

# Working-capital assessment method (F-12.2): turnover method up to the
# limit, MPBF (with CMA data) above it.
working_capital:
  mpbf_above_limit_inr: 50000000
  source: regulatory
  status: provisional
  # Turnover method (F-22.2): the requirement is 25% of projected turnover,
  # of which the borrower brings at least 5% and the bank finances up to 20%.
  turnover_requirement_pct: 25
  turnover_margin_pct: 5
  # MPBF, second method: the borrower brings 25% of current assets.
  mpbf_margin_pct: 25

ratios:
  - key: current-ratio
    label: Current ratio
    unit: x
    kind: min
    acceptable: 1.2
    marginal: 1.1
    formula: "Current assets ÷ Current liabilities"
    applies: All working-capital exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: tol-tnw
    label: TOL / TNW
    unit: x
    kind: max
    acceptable: 3.0
    marginal: 3.75
    formula: "Total outside liabilities ÷ Tangible net worth"
    applies: All fund-based exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: dscr
    label: DSCR
    unit: x
    kind: min
    acceptable: 1.5
    marginal: 1.25
    formula: "(PAT + depreciation + interest on term debt) ÷ (interest + principal repayments on term debt)"
    applies: Term exposures and any borrower with instalment obligations
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: interest-coverage
    label: Interest coverage
    unit: x
    kind: min
    acceptable: 2.5
    marginal: 1.75
    formula: "EBIT ÷ Interest and finance charges"
    applies: All exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: buyer-concentration
    label: Buyer concentration
    unit: "%"
    kind: max
    acceptable: 35
    marginal: 45
    formula: "Largest customer's share of gross sales"
    applies: Manufacturing and trading exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: debt-equity
    label: Debt / equity
    unit: x
    kind: max
    acceptable: 2.0
    marginal: 2.5
    formula: "Total debt ÷ Tangible net worth"
    applies: All fund-based exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

  - key: wc-cycle
    label: Working-capital cycle
    unit: days
    kind: max
    acceptable: 75
    marginal: 95
    formula: "Inventory days + receivable days − payable days"
    applies: Manufacturing and trading exposures
    source: provisional
    status: provisional
    note: "Interim threshold awaiting RBL's policy norms."

# Deviation categories (F-20.1). A breached norm is listed under its
# category; the approving authority (F-21) is looked up by category.
deviation_categories:
  - {key: eligibility, label: Eligibility}
  - {key: financial, label: Financial norms}
  - {key: security, label: Security cover}
  - {key: documentation, label: Documentation}

# What to ask the promoter about a deviation, by norm family, and about a norm
# that could not be evaluated, by the reason (F-24.1). A norm's own
# `pd_question` overrides its family's, and its `pd_gap_question` the
# cannot_evaluate question. The note prints the question on its own, above the
# sentence that leads into it here, so the question names what it asks about:
# {subject} is the norm's label as it reads inside a sentence (DSCR,
# working-capital cycle). A norm written in words (positive, no loss) reads
# "where the norm is ...", as the memo writes it; a count of open items, "the norm allows
# none". {actual} may be one or several (1 year, 2 years): the wording around it reads
# right either way. A question may also name each figure the norm rests on by its input
# ({amount_requested}, {revenue_from_operations}) and, after a shortfall, {s} its plural ending
# (engine/pd_note.py lists the rest).
pd_questions:
  eligibility: "{label} is {actual} against a norm of {required}. What is the background to the deviation on the {subject}, and what mitigates the risk?"
  ratios: "{label} is {actual} in {period} against a norm of {required}. What explains the deviation on the {subject}, and what is the outlook for the current year?"
  security_cover: "{label} is {actual} against a norm of {required}. What further security can be offered to meet the norm for the {subject}?"
  documentation: "{label}: {actual} against a norm of {required}. When can the documentation shortfall be made good?"
  # A norm that could not be evaluated: {reason} is the memo's sentence saying why, and
  # {missing} names the figures not on file.
  cannot_evaluate: "{reason} Can the figures for {missing} be provided, with supporting documents?"
  # A norm whose divisor is zero or negative: {inputs} names the divisor.
  zero_denominator: "{label} could not be computed because {inputs} is zero. What explains the nil {inputs}?"
  denominator_not_positive: "{label} could not be computed because {inputs} is negative. What explains the negative {inputs}?"

# Norms evaluated for every case (F-20). `expression` is arithmetic (+ - * /
# and brackets) over the inputs listed in engine/configstore/schema.py
# POLICY_INPUTS; financial inputs are from the latest audited statements.
# A ratio norm takes its label, unit, direction and threshold (`acceptable`)
# from `ratios` above. An input that is not on file makes the norm "cannot
# evaluate", never a pass (F-20.3).
norms:
  # --- Eligibility ---
  - id: EL-01
    family: eligibility
    label: Business vintage
    expression: vintage_years
    unit: years
    kind: min
    threshold: 3
    category: eligibility
    constitutions: [private_limited]
    source: provisional
    status: provisional
    note: "Completed months since incorporation to the case's as-of date, in years. Partnerships and proprietorships: no registration-date document is in scope yet, so the norm does not apply to them."
    pd_gap_question: "{reason} Can the certificate of incorporation, showing the date of incorporation, be provided?"
  - id: EL-02
    family: eligibility
    label: Commercial bureau rank
    expression: bureau_rank
    unit: rank
    kind: max
    threshold: 6
    category: eligibility
    pd_gap: skip
    source: provisional
    status: provisional
    note: "Rank 1 is the lowest risk. From the latest commercial bureau report; a report without a numeric rank cannot be evaluated. The bank obtains the report, so a missing report is not asked of the promoter."
  - id: EL-03
    family: eligibility
    label: Positive net worth
    expression: net_worth
    unit: inr
    kind: min
    threshold: 1
    category: eligibility
    source: provisional
    status: provisional
    pd_question: "Net worth is {actual} in {period}, where the norm is {required}. What has eroded the net worth, and how will it be restored?"
  - id: EL-04
    family: eligibility
    label: Profit in the latest year
    expression: profit_after_tax
    unit: inr
    kind: min
    threshold: 0
    category: eligibility
    source: provisional
    status: provisional
    pd_question: "Profit after tax is {actual} in {period}, where the norm is {required}. What caused the loss, and what is the outlook for the current year?"
  - id: EL-05
    family: eligibility
    label: Total request against turnover
    expression: amount_requested / revenue_from_operations * 100
    unit: "%"
    kind: max
    threshold: 20
    category: eligibility
    applies_when: turnover_method
    source: provisional
    status: provisional
    note: "Turnover method (requests up to INR 5.00 cr): the bank finances up to 20% of annual turnover. The whole amount requested is used, including any term loan, until per-facility amounts are captured."
    pd_question: "{label} is {actual} against a norm of {required}. Why is the total request of {amount_requested} {actual} of the turnover of {revenue_from_operations} in {period}, and what supports a request of that size?"

  # --- Financial ratios ---
  - id: FR-01
    family: ratios
    ratio: current-ratio
    expression: current_assets / current_liabilities
    category: financial
    applies_when: working_capital
  - id: FR-02
    family: ratios
    ratio: tol-tnw
    expression: (long_term_borrowings + current_liabilities) / net_worth
    category: financial
    non_positive_denominator: deviation
    note: "Net worth is share capital plus reserves and surplus; intangible assets are not deducted, and only long-term borrowings are counted among non-current liabilities, until RBL defines tangible net worth."
  - id: FR-03
    family: ratios
    ratio: dscr
    expression: (profit_after_tax + depreciation) / (annual_instalments + proposed_instalments)
    category: financial
    applies_when: term_debt
    note: "Interim and conservative until RBL's DSCR definition: annual instalments (interest and principal) on existing facilities, declared, sanctioned or inferred from bank statements, and on the proposed term loan; interest on term debt is not added back."
    # The proposed instalment is entered by the RM once the bank sets the rate and tenor: the
    # promoter is asked what sets them.
    pd_gap_question: "{reason} What will the term loan finance, at what cost and promoter contribution, and what tenor and moratorium are sought?"
  - id: FR-04
    family: ratios
    ratio: interest-coverage
    expression: (profit_before_tax + finance_costs) / finance_costs
    category: financial
  - id: FR-05
    family: ratios
    ratio: debt-equity
    expression: total_borrowings / net_worth
    category: financial
    non_positive_denominator: deviation
    note: "Net worth is share capital plus reserves and surplus; intangible assets are not deducted, until RBL defines tangible net worth."
  - id: FR-06
    family: ratios
    ratio: wc-cycle
    expression: (inventories + trade_receivables - trade_payables) / revenue_from_operations * 365
    category: financial
    applies_when: working_capital
    note: "Days on sales; RBL's own computation may use cost of sales for inventory and payables."

  - id: DOC-01
    family: documentation
    label: Blocking checklist items open
    expression: blocking_items_open
    unit: count
    kind: max
    threshold: 0
    category: documentation
    source: provisional
    status: provisional
    pd_question: "{label}: {actual}; the norm allows {required}. Which of the blocking documents listed under Documents to collect can be provided, and by when?"
  - id: DOC-02
    family: documentation
    label: Years of audited financial statements
    expression: audited_years
    unit: years
    kind: min
    threshold: 2
    category: documentation
    source: provisional
    status: provisional
    pd_question: "Audited financial statements are on file for {actual}, against a norm of {required}. When will the audited financial statements for the year{s} not on file be provided?"

# How each schema field and table is read (FRD F-15). document_types.json says WHAT exists;
# this file says where it is printed. Order of attempts for a field:
#   identifier scan -> label aliases -> patterns -> (optional) model for what is still missing.
# Patterns: group 1 is the value unless `group` says otherwise; flags i=ignore case, m=multiline,
# s=dot matches newline; `multi: true` makes every match one list element.
# F-15.9: the gap fields. The cross-checks read these from any document, whatever its type
# (engine/facts.py identities: PAN, GSTIN, CIN, legal name). A document of a type a person made for
# one appraisal (F-09.8) is read for each, with the same request for every document: never another
# document's value. Every value found waits for a person's confirmation before a check uses it.
# Story 2.6: characters a scan confuses, read as a PAN's or GSTIN's position requires, to find one the format misses as
# printed ("AAACR5O55K"). Used to find the value only; a reading counts when a check on the same document confirms it
# (a GSTIN's check digit, or a PAN that is the PAN inside one of the document's GSTINs), and it always goes to review.
identifier_reading:
  digit_as_letter: {"0": O, "1": I, "2": Z, "5": S, "8": B}
  letter_as_digit: {O: "0", D: "0", Q: "0", I: "1", L: "1", Z: "2", S: "5", B: "8"}
  max_corrections: 2

# Story 5.4: how amounts are printed. Brackets and a leading minus are always negative.
numbers:
  nil_words: [nil]                 # a cell holding only this is 0
  debit_markers: [dr]              # before or after a figure, with or without a full stop: negative
  credit_markers: [cr]             # before or after a figure: the marker is dropped
  trailing_minus: true             # "1,234-" is negative
  space_grouping: true             # "1 23 456" is one figure when the pieces form a grouping and no comma is printed

# Story 5.3: the unit amounts are printed in, stated in a table's caption or a page's title lines ("Rs. in lakhs",
# "(Rs. '000)", "All amounts in Indian Rupees"). The key is the name the engine scales by; rupee is 1.
units:
  words:
    thousand: [thousand, thousands, "'000", 000s, "000's", "000"]
    lakh: [lakh, lakhs, lac, lacs]
    crore: [crore, crores, cr]
    million: [million, millions, mn]
    rupee: [rupees, rupee, indian rupees, inr, rs, ₹]
  currency: [rs, inr, ₹, rupees]   # may stand beside a unit in a bracket: (Rs. '000)
  reach: 4                         # a unit word counts at most this many words after "in"
  required: [audited_financial_statements, provisional_financial_statements, projected_financial_statements, cma_data]

gap_fields:
  pan: {identifier: pan, llm_hint: "the permanent account number (PAN) of the business the document is about, not of a customer, supplier or official"}
  gstin: {identifier: gstin, llm_hint: "the GSTIN of the business the document is about, not of a customer or supplier"}
  cin: {identifier: cin, llm_hint: "the corporate identity number (CIN) of the company the document is about"}
  legal_name: {llm_hint: "the full legal name of the business the document is about, as printed"}

types:
  certificate_of_incorporation:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: company_name, cin: cin}
    fields:
      company_name: {aliases: ['Name of Company'], llm_hint: 'the full legal name of the company, as printed in the certificate text (for example "X PRIVATE LIMITED")'}
      cin: {identifier: cin, validators: ['format:cin']}
      date_of_incorporation: {aliases: ['Date of Incorporation'], llm_hint: 'the date the company was incorporated, copied as printed (it may be written in words)'}
      company_type: {aliases: ['Company Category'], llm_hint: 'the type of company as printed, for example "Company limited by shares" or "Private Limited"; null if not stated'}
      registered_address: {aliases: ['Registered Office'], llm: true, llm_hint: 'the address of the registered office, as printed'}
      roc: {patterns: ['Office of the (Registrar of Companies[^\n]*)'], llm_hint: 'the Registrar of Companies office named in the certificate, as printed'}
      pan: {identifier: pan, validators: ['format:pan']}
      tan: {identifier: tan, validators: ['format:tan']}
      certificate_kind: {patterns: ['^\s*((?:Fresh\s+)?Certificate of Incorporation(?:\s+Consequent upon[^\n]*)?)'], llm_hint: 'the heading of the certificate as printed: "Certificate of Incorporation", or "Fresh Certificate of Incorporation Consequent upon Change of Name" (or upon conversion)'}
      former_name: {llm_hint: 'the former name of the company, printed only on a fresh certificate issued after a change of name; null if not stated'}

  memorandum_articles_of_association:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: company_name, cin: cin}
    fields:
      company_name: {patterns: ['The name of the company is\s+(.+?)\.\s*$'], llm_hint: 'the name of the company, from the name clause (for example "The name of the company is X PRIVATE LIMITED")'}
      cin: {identifier: cin, validators: ['format:cin']}
      registered_office: {patterns: ['registered office of the company will be situated in the State of\s+([A-Za-z ]+?)\.'], llm_hint: 'the State in which the registered office is to be situated, or the registered office address, as the memorandum states it'}
      authorized_share_capital: {patterns: ['authori[sz]ed\s+share\s+capital\s+of\s+the\s+company\s+is\s+Rs\.?\s*([\d,]+)'], llm_hint: 'the authorised share capital in rupees, the amount only, as printed'}
      paid_up_share_capital: {patterns: ['paid-?up\s+capital\s+is\s+Rs\.?\s*([\d,]+)'], llm_hint: 'the paid-up (subscribed) share capital in rupees, the amount only, as printed; null if not stated'}
      objects_of_company: {patterns: [{regex: 'MAIN OBJECTS TO BE PURSUED[^\n]*\n(.+?)\n\(B\)', flags: ims, span_pages: true}], llm_hint: 'the main objects clause, copied as printed; null if absent'}
      directors: {patterns: [{regex: 'first\s+directors\s+of\s+the\s+company\s+are\s+(.+?)\.\s*$', flags: ims, multi: true, split: '\s+and\s+|,\s*', strip: '^(?:Smt|Sri|Shri|Mr|Ms|Mrs)\.?\s+'}], llm: true, llm_hint: 'the first directors named in the articles, one entry per person with the name only (no title) and the DIN when printed'}
      liability_clause: {patterns: [{regex: '(The liability of the members?(?:\(s\))? is limited.*?\.)', flags: is}], llm_hint: 'the liability clause (clause IV) as printed, for example "The liability of the member(s) is limited and this liability is limited to the amount unpaid, if any, on the shares held by them"'}
      face_value_per_share: {patterns: ['shares\s+of\s+Rs\.?\s*([\d,]+(?:\.\d+)?)\s*(?:/-\s*)?each'], llm_hint: 'the face value of one share in rupees from the capital clause ("... shares of Rs. 10 each"), the amount only, as printed'}
      borrowing_powers: {llm_hint: 'the article on borrowing powers, as printed: whether the Board may borrow, and any cap, condition or need for members approval; null if the articles have none'}
      private_company_restrictions: {llm_hint: 'the definition of a private company in the articles, as printed: restriction on transfer of shares, members limited to two hundred, no invitation to the public; null if absent'}
      latest_alteration_date: {llm_hint: 'the date of the latest alteration noted beside an altered clause ("Altered vide special resolution dated ..."), copied as printed; null if none'}
    table_keywords:
      shareholding:
        label: shareholder_name
        headings:
          shareholder_name: [name address description and occupation of subscriber, name of subscriber, name of subscribers, name]
          number_of_shares: [number of shares, no of shares, no of equity shares, shares taken, shares]
          signature: [signature]
        ignore: [signature]
  company_pan:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: company_name, pan: pan}
    fields:
      company_name: {aliases: ['Name'], llm_hint: 'the name of the company printed on the PAN card or allotment letter'}
      pan: {identifier: pan, validators: ['format:pan']}
      date_of_issue: {patterns: ['^Date:\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4})'], llm_hint: 'the date the PAN was issued or the letter dated, copied as printed'}
      date_of_incorporation: {aliases: ['Date of Incorporation(?:/Formation)?'], llm_hint: 'the date of incorporation or formation printed on the e-PAN ("Date of Incorporation/Formation"), copied as printed; null if not printed'}

  director_kyc:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: person_name, pan: pan, din: din, dob: date_of_birth}
    fields:
      father_or_spouse_name: {llm_hint: "the father's or spouse's name, if stated; null if not"}
      gender: {llm_hint: 'the gender, if stated; null if not'}
      person_name: {aliases: ['Name of Director'], llm_hint: 'the full name of the director or person the KYC is about'}
      din: {aliases: ['Director Identification Number'], validators: ['format:din'], llm_hint: 'the Director Identification Number, 8 digits'}
      designation: {aliases: ['Designation'], llm_hint: 'the designation, for example Director or Managing Director'}
      date_of_birth: {aliases: ['Date of Birth'], llm_hint: 'the date of birth, copied as printed'}
      pan: {aliases: ['PAN \(masked\)', 'PAN'], validators: ['format:masked_pan'], llm_hint: 'the PAN, as printed (it may be masked)'}
      id_document_type: {patterns: ['\b(Aadhaar)\s+\(masked\)'], llm_hint: 'the type of identity document shown (for example Aadhaar, Passport), as printed'}
      id_number: {aliases: ['Aadhaar \(masked\)'], validators: ['format:masked_aadhaar'], llm_hint: 'the identity document number, as printed (it may be masked)'}
      address: {aliases: ['Residential Address'], llm_hint: 'the residential address, as printed'}
      # The KYC summary sheet does not print an identity document's number or dates; the model is not asked for them.
      document_number: {llm: false}
      issue_date: {llm: false}
      expiry_date: {aliases: ['Date of Expiry', 'Expiry Date', 'Valid Until'], llm: false}

  board_resolution_borrowing:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: company_name}
    fields:
      resolution_number: {llm_hint: 'the resolution number or reference, if stated; null if not'}
      company_name: {patterns: [{regex: 'Board of Directors of\s+(.+?)\s*\(CIN', flags: ims}], llm_hint: 'the name of the company whose Board passed the resolution'}
      meeting_date: {patterns: [{regex: '\bon\s+(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),?\s+(\d{1,2}\s+[A-Za-z]+\s+\d{4})', flags: ims}], llm_hint: 'the date of the Board meeting, copied as printed'}
      borrowing_limit: {patterns: ['aggregating\s+to\s+Rs\.?\s*([\d,]+)'], llm_hint: 'the aggregate borrowing limit in rupees, the amount only, as printed'}
      lender_name: {patterns: [{regex: 'borrow\s+from\s+(.+?),\s*credit\s+facilities', flags: ims}], llm_hint: 'the bank or lender the resolution authorises borrowing from'}
      resolution_date: {llm: false}   # only a date the resolution itself carries; never derived from the meeting date
      purpose_of_borrowing: {llm_hint: "The purpose of the borrowing exactly as the resolution states it (for example 'working capital'). A heading, or the bare words 'borrowing' or 'security', is not a purpose: report null when none is stated."}
      authorized_persons: {patterns: [{regex: '(?:Smt|Sri|Shri|Mr|Ms|Mrs)\.?\s+([A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)*),\s+(?:Managing\s+)?Director', flags: m, multi: true}], llm_hint: 'the directors named as authorised, one entry per person, the name only (leave out titles, designations and DIN numbers)'}
      # The DIN printed after each authorised person, in the same order; used to tell the directors apart, never to correct a value.
      authorized_person_dins: {patterns: [{regex: '(?:Smt|Sri|Shri|Mr|Ms|Mrs)\.?\s+[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)*,\s+(?:Managing\s+)?Director\s*\(DIN\s+(\d{8})\)', flags: m, multi: true}], llm: false}
      authorized_signatories: {llm_hint: "The people the resolution authorises to sign or execute the loan documents: one entry per person, the name only (leave out Smt., Sri., titles, designations and DIN numbers). List every person named."}
      cin: {identifier: cin, validators: ['format:cin']}
      meeting_place: {llm_hint: 'the place where the Board meeting was held, as printed (for example "at the registered office of the company at ..."); null if not stated'}
      facilities_authorised: {llm_hint: 'the facilities the resolution authorises, one entry per facility with its amount as printed (for example "cash credit of Rs 5,00,00,000"); null if none are listed'}
      security_authorised: {llm_hint: 'the security the resolution authorises the company to create (hypothecation, charge or mortgage over named assets), as printed; null if not stated'}
      certified_by: {llm_hint: 'who certified the copy of the resolution, from the certification block ("Certified true copy ... For <Company> ... Director (DIN ...)"): the name, with designation and DIN as printed'}

  audited_financial_statements:
    # The model reads every field (all pages); code checks each value against its page. The aliases and patterns below are the
    # fallback when no model is configured.
    extraction: model
    identity: {name: company_name}
    # Tables found by their column headings, for any layout (Epic 5); the XBRL filing layouts below read that format.
    table_keywords:
      balance_sheet: &statement_table
        label: particulars
        part: balance_sheet
        headings:
          particulars: [particulars, description, items]
          notes: [notes, note, note no, schedule, sch]
        ignore: [notes]
        periods: [current_period, previous_period]     # year columns, latest first, by the dates in their headings
        dash_is_zero: true
      profit_and_loss: {<<: *statement_table, part: profit_and_loss}
      cash_flow: {<<: *statement_table, part: cash_flow, optional: true}   # a small company may file no cash flow
    fields:
      # Statements filed in XBRL print each value on a labelled line ("Name of audit firm  PRICE WATERHOUSE ..."); the hints
      # point the model at those lines, and the rule-read fields try the labelled line first.
      company_name: {aliases: ['Company'], llm_hint: 'the full legal name of the company whose financial statements these are, as printed in the auditor report heading or opinion (for example "X PRIVATE LIMITED"); not a sentence'}
      # The year end the statements print on their own face, read rather than asked of a model:
      # "BALANCE SHEET AS AT 31 MARCH 2026", "...FOR THE YEAR ENDED 31 MARCH 2026", or the filed statement's
      # "Date of end of reporting period  31/03/2026" (its first column is the current period), or a "Financial Year  FY2025"
      # label. The label counts only when a year follows it, so a table cell headed "Financial Year (Rupees ...)" is not read.
      financial_year: {llm: false, patterns: ['^\s*Date of end of reporting period\s+(\d{2}/\d{2}/\d{4})\b', '(?:^|\s{2})Financial Year\s*:?\s*((?:FY\s*)?20\d{2}(?:\S| (?! ))*)', 'BALANCE SHEET AS AT\s+(\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]+,?\s+\d{4})', 'FOR THE (?:YEAR|PERIOD) ENDED(?: ON)?\s+(\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]+,?\s+\d{4})']}
      auditor_name: {aliases: ['Statutory Auditors'], llm_hint: 'the name of the audit firm that signs the auditor report (for example "X & CO LLP"), without logo or title text such as "CA", and without its registration number. In a statement filed in XBRL, the value after "Name of audit firm", whose letters may be spaced out or broken over lines. Not a sentence, and not a name mentioned in the directors report.'}
      audit_date: {patterns: ['Place:\s*[A-Za-z]+\s*\|\s*Date:\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4})'], llm_hint: 'the date the auditor signed the auditor report, copied as printed. In a statement filed in XBRL, the value after "Date of signing audit report by auditors". Not the date the directors signed their report or the board approved the accounts.'}
      accounting_standard: {llm_hint: "The accounting framework the statements as a whole follow (for example 'Indian GAAP' or 'Ind AS'), as stated in the basis of preparation or statement of compliance; not one standard cited for a single disclosure (such as 'Ind AS 24 Related Party Disclosures'). Null if none is named."}
      statement_basis: {llm_hint: 'whether these statements are audited, provisional or projected, from the title or a heading, copied as printed (for example "Provisional Financial Statements"); for statements with a signed auditor report, the words of the report heading ("Independent Auditor''s Report")'}
      auditor_frn: {patterns: ['Firm\s+Registration\s+(?:No\.?|Number)\s*:?\s*([0-9]{6}[A-Z](?:/[A-Z0-9]+)?)'], llm_hint: 'the audit firm registration number (FRN) printed in the auditor signature block, for example "123456W"; the number only'}
      auditor_membership_no: {patterns: ['Membership\s+(?:No\.?|Number)\s*:?\s*(\d{5,6})'], llm_hint: 'the membership number of the partner who signed the auditor report, the number only'}
      udin: {identifier: udin, page_match: 'UDIN', validators: ['format:udin']}
      audit_opinion: {llm_hint: 'the heading of the opinion paragraph in the auditor report, copied as printed: "Opinion", "Qualified Opinion", "Adverse Opinion" or "Disclaimer of Opinion"'}
      going_concern_uncertainty: {normaliser: present, llm_hint: 'the heading "Material Uncertainty Related to Going Concern" copied as printed, only when the auditor report has such a paragraph; null when it has none'}
      caro_remarks: {llm_hint: 'adverse remarks in the CARO annexure to the auditor report (default in repayment of loans, clause ix; undisputed statutory dues outstanding, clause vii; fraud, clause xi): one entry per remark, copied as printed; null if there are none'}
      # Figures from the notes to accounts, as printed (in the statements' own unit, see amount_unit).
      current_maturities_of_long_term_debt: {llm_hint: 'from the note on short-term borrowings (or other current liabilities), the current year amount of "Current maturities of long-term debt" (or long-term borrowings), as printed; null if not stated'}
      bank_working_capital_borrowings: {llm_hint: 'from the note on short-term borrowings, the current year amount of loans repayable on demand from banks (cash credit, overdraft or working capital loans), as printed; null if not stated'}
      finance_costs_term_loans: {llm_hint: 'from the note on finance costs, the current year interest on term loans, as printed; null if the note does not show it separately'}
      loans_from_directors: {llm_hint: 'from the notes on borrowings, the current year amount of loans from directors or related parties, as printed; null if not stated'}
      receivables_over_6_months: {llm_hint: 'from the ageing of trade receivables, the current year amount outstanding for more than six months from the due date, as printed; null if not stated'}
      contingent_liabilities: {llm_hint: 'from the note on contingent liabilities and commitments, the current year total of contingent liabilities, as printed; null if the note is absent or says nil'}
      shareholders_above_5pct: {llm_hint: 'from the note on share capital, the shareholders holding more than 5 per cent of the shares: one entry per shareholder with the name, the number of shares and the percentage held, each copied as printed'}
      # The unit the statements print their amounts in, read from the face ("All Amounts are in INR Thousands", "(Rs. in lakhs)",
      # a filed statement's "Level of rounding used in financial statements  Millions"); absent means rupees.
      amount_unit: {llm: false, patterns: ['^\s*Level of rounding used in financial statements\s+(thousands?|lakhs?|lacs?|crores?|millions?)\b', '(?:amounts?|figures|values)?\s*(?:are\s+)?in\s+(?:INR|Rs\.?|₹)?\s*(thousands?|lakhs?|lacs?|crores?|millions?)\b', '(?:INR|Rs\.?|₹)\s*in\s+(thousands?|lakhs?|lacs?|crores?|millions?)\b']}
    tables: &financial_statement_tables  # provisional statements read the same layouts
      # Statements are found by their headings (table_keywords above). These layouts read the one format headings do not:
      # the XBRL filing as the registrar renders it (Epic 5: the sample-specific layouts were retired once the keyword
      # reading read every table they did).
      #
      # XBRL filing layout (the statements as filed with the registrar, rendered to PDF): each statement opens with its
      # taxonomy code ("[110000] Balance sheet", "[210000] Statement of profit and loss", "[320000] Cash flow statement"),
      # headed by its period dates and a "<statement> [Abstract]" line; there is no Particulars or Notes heading. Groups are
      # announced by "[Abstract]" lines, and yes/no facts by "Whether ..." lines: both are dropped, with the running page
      # heading and per-share lines. A row starts where the current period prints a figure; a label that wraps prints its
      # figures on a line of their own between its halves, so label lines join the row within a few points of them.
      # The first Ind AS year adds a third balance-sheet column (the transition date), read and not kept.
      balance_sheet:
        - page_match: '^\[110000\]\s+Balance sheet'
          start: '^\d{2}/\d{2}/\d{4}\s+\d{2}/\d{2}/\d{4}'
          header_lines: 1
          end: '^\[\d{6}[a-z]?\]'
          multi_page: true
          row_start: '^[-(]?\d'
          row_start_col: current_period
          max_attach: 8
          skip_rows: ['^$']
          drop_lines: &xbrl_drop ['\[(?:Abstract|Line ?items|Table|Axis|Member|TextBlock)\]', 'Financial Statements for period \d', '^Unless otherwise specified', '^Whether\b', '^(?:Yes|No)\s+(?:Yes|No)$', '\[INR/shares\]']
          columns:
            - {name: particulars, header: '^\[Abstract\]$'}
            - {name: current_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 0, align: right}
            - {name: previous_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 1, align: right}
            - {name: transition_date, header: '^\d{2}/\d{2}/\d{4}$', nth: 2, align: right, emit: false}
      profit_and_loss:
        - page_match: '^\[210000\]\s+Statement of profit and loss|^\s*Statement of profit and loss \[Abstract\]\s*$'
          start: '^\d{2}/\d{2}/\d{4}\s+\d{2}/\d{2}/\d{4}$'
          header_lines: 3
          # The statement ends at the next statement's code, or where its earnings-per-share text block begins (the
          # block's content, printed after the line items, is a note in words and figures, not a line of the statement).
          end: '^\[\d{6}[a-z]?\]|^\s*Textual information \(\d+\)\s*$'
          multi_page: true
          row_start: '^[-(]?\d'
          row_start_col: current_period
          max_attach: 8
          skip_rows: ['^$']
          drop_lines: *xbrl_drop
          columns:
            - {name: particulars, header: '^\[Abstract\]$'}
            - {name: current_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 0, align: right}
            - {name: previous_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 1, align: right}
      cash_flow:
        - optional: true
          page_match: '^\[320000\]\s+Cash flow statement'
          start: '^\d{2}/\d{2}/\d{4}\s+\d{2}/\d{2}/\d{4}$'
          header_lines: 3
          end: '^\[\d{6}[a-z]?\]'
          multi_page: true
          row_start: '^[-(]?\d'
          row_start_col: current_period
          max_attach: 8
          skip_rows: ['^$']
          drop_lines: *xbrl_drop
          columns:
            - {name: particulars, header: '^\[Abstract\]$'}
            - {name: current_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 0, align: right}
            - {name: previous_period, header: '^\d{2}/\d{2}/\d{4}$', nth: 1, align: right}

    # When neither the headings nor the XBRL layouts find a statement, the model maps its rows from the pages that name it; every
    # figure is still read from the page (stages/extract/llm_tables.py), and the document goes to a person once.
    model_tables:
      balance_sheet:
        pages: ['balance\s+sheet', 'statement\s+of\s+(assets\s+and\s+liabilities|financial\s+position)', '\[110000\]']
        span: 2
        hints: &period_hints
          current_period: the figure for the year the statements are for (the first figure column)
          previous_period: the figure for the year before (the comparative column)
      profit_and_loss:
        pages: ['profit\s*(and|&)\s*loss', 'income\s+(and\s+expenditure|statement)', '\[210000\]']
        span: 2
        hints: *period_hints
      cash_flow:
        pages: ['cash[\s-]*flow', '\[320000\]']
        span: 2
        hints: *period_hints

  income_tax_return:
    # The model reads the fields from the first page and the computation sections (Part B-TI and B-TTI); code checks every
    # value against its page and validators.yaml checks the figures against each other. Identifiers stay rule-based.
    # The aliases and patterns below are the fallback when no model is configured; with a model they are not used.
    extraction: model
    model_pages:
      - {match: 'PART B[\s_-]*TI\s*-\s*COMPUTATION OF TOTAL INCOME', span: 4}
      - {match: 'FINANCIAL YEAR 20\d{2}-\d{2}', span: 1}
      - {match: '^\s*VERIFICATION\b', span: 1}
    identity: {name: taxpayer_name, pan: pan}
    fields:
      pan: {identifier: pan, validators: ['format:pan']}
      taxpayer_name: {aliases: ['Name of (?:the )?(?:assessee|taxpayer)', 'Assessee Name', 'Taxpayer Name', 'Name'], llm_hint: 'the name of the company or person filing, printed under "Name" in Part A on the first page (not a question or a label)'}
      assessment_year: {aliases: ['Assessment Year', 'A\.?Y\.?'], llm_hint: 'the assessment year of the return, written like 2024-25, printed beside "Assessment Year" on the first page'}
      financial_year: {aliases: ['Financial Year', 'Previous Year'], patterns: ['for the (FY\d{4})'], llm_hint: 'the financial year the return covers, written like 2023-24, copied as the year span only (2023-24), without the words before it, from a heading such as "FINANCIAL YEAR 2023-24"'}
      filing_date: {aliases: ['Date of (?:e-?)?Filing', 'Filing Date', 'e-?Filed on', 'Filed on', 'Date of Submission'], llm_hint: 'the date of filing, printed as "Date of Filing" in the header at the top of the first page'}
      acknowledgement_number: {aliases: ['e-?Filing Acknowledgement(?: Number| No\.?)?', 'Acknowledgement (?:Number|No\.?)', 'Ack(?:nowledgement)?\.? (?:Number|No\.?)', 'Receipt (?:Number|No\.?)'], llm_hint: 'the acknowledgement number, printed as "Acknowledgement Number" in the header at the top of the first page'}
      gross_total_income: {aliases: ['Gross Total Income'], patterns: ['Gross Total Income\s+([\d,]+)'], llm_hint: 'Part B-TI, the row "Gross Total income (7 - 8)", item 9; the amount in the last column'}
      total_income: {aliases: ['Total Income', 'Total Taxable Income'], llm_hint: 'Part B-TI, the row "Total income (9 - 11c - 12)", item 13; the amount in the last column'}
      tax_payable: {aliases: ['Total Tax and Interest Payable', 'Total Tax Payable', 'Net Tax Payable'], llm_hint: 'Part B-TTI, the row "Aggregate liability (7 + 8e)", item 9; the amount in the last column'}
      tax_paid: {aliases: ['Taxes Paid \(TDS \+ Advance \+', 'Total Taxes Paid', 'Taxes Paid'], llm_hint: 'Part B-TTI, the row "Total Taxes Paid (10a+10b+10c+10d)", item 10e; the amount in the last column'}
      refund_amount: {aliases: ['Tax Payable / \(Refund\)', 'Refund(?:able)? Amount', 'Refund Due'], llm_hint: 'Part B-TTI, the row "Refund (If 10e is greater than 9)", item 12; the amount in the last column'}
      itr_form: {patterns: ['\b(ITR-\s?[1-7])\b'], llm_hint: 'the ITR form number printed in the heading of the return, for example "ITR-6"'}
      filing_section: {aliases: ['Filed u/s', 'Filed under section'], llm_hint: 'the section the return was filed under, as printed, for example "139(1)" for an original return, "139(4)" belated or "139(5)" revised'}
      verification_mode: {aliases: ['Verified (?:by|using|through)', 'Mode of verification'], llm_hint: 'how the return was verified, as printed: digital signature certificate (DSC) or electronic verification code (EVC); null if not stated'}
    table_keywords:
      income_computation:
        label: particulars
        part: itr_computation
        headings:
          particulars: [particulars, description, head of income]
          amount: [amount]
  gstr_3b:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: legal_name, gstin: gstin}
    fields:
      gstin: {identifier: gstin, validators: ['format:gstin']}
      legal_name: {aliases: ['2\(a\)\.?\s*Legal name of the registered person', 'Legal Name'], llm_hint: 'the legal name of the registered person (table 2(a))'}
      trade_name: {aliases: ['2\(b\)\.?\s*Trade name, if any', 'Trade Name'], llm_hint: 'the trade name, table 2(b), if any; null if none'}
      financial_year: {patterns: ['^\s*Year\s+(\d{4}-\d{2})\s*$'], llm_hint: 'the financial year of the return, written like 2025-26'}
      tax_period: {patterns: ['^\s*Period\s+([A-Za-z]{3}(?:-[A-Za-z]{3})?)\s*$', {regex: '(?:^|\s{2})Tax Period\s+(\S.*?)(?:\s{2}|$)', flags: m}], llm_hint: 'the tax period of the return, the month name as printed (for example Dec)'}
      filing_date: {aliases: ['2\(d\)\.?\s*Date of ARN', 'Date of Filing'], llm_hint: 'the date of filing or ARN date, table 2(d), copied as printed'}
      return_status: {patterns: ['Return status:\s*([A-Za-z]+)'], llm: false}
      arn: {aliases: ['2\(c\)\.?\s*ARN', 'ARN'], llm_hint: 'the ARN (acknowledgement reference number) of the return, table 2(c), as printed'}
    table_keywords:   # each table by its columns' headings
      outward_supplies:
        label: description
        headings:
          description: [nature of supplies, nature of supply, description]
          taxable_value: [total taxable value, taxable value, taxable]
          igst: [integrated tax, igst]
          cgst: [central tax, cgst]
          sgst: [state ut tax, sgst]
          cess: [cess]
        ignore: [cess]
      input_tax_credit:
        label: description
        headings:
          description: [details]
          igst: [integrated tax, igst]
          cgst: [central tax, cgst]
          sgst: [state ut tax, sgst]
          cess: [cess]
        ignore: [cess]
      tax_payment:
        label: tax_type
        headings:
          tax_type: [description]
          tax_amount: [tax payable, tax]
          paid_itc: [paid through itc]
          itc_igst: [integrated tax, integrated]
          itc_cgst: [central tax, central]
          itc_sgst: [state ut tax, state ut]
          itc_cess: [cess]
          paid_cash: [paid in cash, tax paid in cash]
          interest: [interest]
          late_fee: [late fee, late]
  gstr_1:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    identity: {name: legal_name, gstin: gstin}
    fields:
      gstin: {identifier: gstin, validators: ['format:gstin']}
      legal_name: {aliases: ['Legal name of the registered person'], llm_hint: 'the legal name of the registered person (table 2(a))'}
      trade_name: {aliases: ['Trade name if any'], llm_hint: 'the trade name, if any; null if none'}
      financial_year: {patterns: ['Financial year\s+(\d{4}-\d{2})\b'], llm_hint: 'the financial year of the return, written like 2025-26'}
      tax_period: {patterns: ['Tax period\s+([A-Za-z]{3}(?:-[A-Za-z]{3})?)\s*$'], llm_hint: 'the tax period of the return, the month name as printed (for example Dec)'}
      filing_date: {aliases: ['ARN date'], llm_hint: 'the ARN date, copied as printed'}
    # One row per section, from its Total line, headed by the section's own title (4A, 4B, 5, 6A to 6C, 7, 8).
    table_keywords:
      outward_supplies:
        label: description
        headings:
          description: [description]
          records: [no of records, records]
          doc_type: [type]
          value: [taxable value, value]
          igst: [integrated tax, integrated, igst]
          cgst: [central tax, central, cgst]
          sgst: [state ut tax, state ut, sgst]
          cess: [cess]
        ignore: [doc_type]
        multi_page: true
  bank_statement:
    extraction: model   # the model reads each field; code checks the value on its page; the rules below are the fallback without a model
    model_pages:
      - {match: 'Statement Summary', span: 1}
    identity: {name: account_holder_name}
    fields:
      account_holder_name: {aliases: ['Account Name'], llm_hint: 'the name of the account holder, as printed'}
      account_number: {patterns: ['\bAccount(?:\s+(?:No\.?|Number))?\s+(\d{9,18})\b'], llm_hint: 'the account number, digits only as printed'}
      bank_name: {patterns: ['^(.+?\bBank)\s*$'], llm_hint: 'the name of the bank that issued the statement'}
      branch: {patterns: ['Branch\s*/\s*IFSC\s+(.+?)\s*/\s*[A-Z]{4}0[A-Z0-9]{6}\b'], llm_hint: 'the branch name, as printed'}
      ifsc: {identifier: ifsc, validators: ['format:ifsc']}
      statement_period_start: {patterns: ['Statement\s+(\d{1,2}\s+[A-Za-z]+\s+\d{4})\s+to\s+\d{1,2}\s+[A-Za-z]+\s+\d{4}'], llm_hint: 'the first date of the statement period, copied as printed'}
      statement_period_end: {patterns: ['Statement\s+\d{1,2}\s+[A-Za-z]+\s+\d{4}\s+to\s+(\d{1,2}\s+[A-Za-z]+\s+\d{4})'], llm_hint: 'the last date of the statement period, copied as printed'}
      opening_balance: {patterns: ['Opening Balance\s*\([^)]*\)\s+([\d,]+)'], llm_hint: 'the opening balance of the period, the amount only, as printed'}
      closing_balance: {patterns: ['Closing Balance\s*\([^)]*\)\s+([\d,]+)'], llm_hint: 'the closing balance of the period, the amount only, as printed'}
      currency: {patterns: ['Currency\s+([A-Z]{3})\b'], llm_hint: 'the currency code, for example INR'}
      account_type: {aliases: ['Account Type', 'A/c Type', 'Product'], llm_hint: 'the type of account as printed, for example Current Account, Cash Credit, Overdraft or Savings'}
      sanctioned_limit: {aliases: ['Sanctioned Limit', 'Limit'], llm_hint: 'the sanctioned limit of a cash credit or overdraft account, the amount only, as printed; null for other accounts'}
      drawing_power: {aliases: ['Drawing Power', 'DP'], llm_hint: 'the drawing power of a cash credit or overdraft account, the amount only, as printed; null if not stated'}
      customer_id: {aliases: ['Customer ID', 'Cust(?:omer)?\.? ID', 'CIF(?: No\.?| Number)?'], llm_hint: 'the customer ID or CIF number, as printed'}
      holder_address: {aliases: ['Address'], llm_hint: 'the address printed under the account holder name, as printed'}
    table_keywords:
      transactions:
        label: date
        part: transactions
        headings:   # each column by its role, as banks head it
          date: [date, txn date, transaction date, tran date, posting date]
          value_date: [value date, value dt]
          description: [particulars, narration, description, transaction details, details, remarks]
          reference_number: [reference, ref no, chq no, cheque no, chq ref no, instrument no, utr no]
          debit: [debit, withdrawal, withdrawals, withdrawal amt, debit amount, dr]
          credit: [credit, deposit, deposits, deposit amt, credit amount, cr]
          balance: [balance, closing balance, running balance, balance amt]
          amount: [amount, transaction amount, txn amount]     # one column for both directions ...
          dr_cr: [dr cr, cr dr, dr/cr, cr/dr, type]              # ... with its marker
        signed: {amount: amount, marker: dr_cr, debit: debit, credit: credit}
        ignore: [amount, dr_cr]
        join: {reference_number: ""}
        multi_page: true
        repair: {kind: running_balance, debit: debit, credit: credit, balance: balance}
  # Declaration of existing facilities: a table of facilities and one of bank accounts. A nil

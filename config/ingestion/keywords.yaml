# How pages are typed (FRD F-09, decision 14). DRAFT for review: nothing reads this file yet (Epic 2 builds the scorer).
#
# A page is read into zones: the title lines, the footer band and the body. A title line is not a table row (a line with
# amounts), and either sits in the header band or stands out in print: on a digital page by the PDF's own font data
# (larger than the page's body text, or bold), on a scanned page by the height of its letters. Each phrase below is matched after folding case,
# punctuation and hyphen-broken words; a phrase of `fuzzy.min_length` letters or more also matches a near spelling
# of a run of whole words (scan errors), a shorter one only exactly (PAN must not match PAD). A warning word matches
# only exactly: the near spellings that matter are opposites (audited, unaudited).
#
# Two levels:
#   parts  what one page, or one table on a page, is: a balance sheet, an auditor's report, a page of transactions.
#          A part can belong to several document types (a balance sheet is in audited, provisional and projected
#          statements), so its words say WHAT the page is, never whose or which basis.
#   types  the document types of document_types.json. Each lists the parts it is made of, and the words that tell it
#          from its look-alikes (audited against provisional). These are read over the whole run of pages the parts
#          form, so a balance sheet page with no "audited" on it still joins the audited statements it sits in.
#
# Scoring, for each part on a page:
#   - a `title` phrase counts only in the title zone (title lines, header band, footer band); in the body it is a
#     mention and counts nothing;
#   - a `content` phrase counts anywhere, once, at its weight (default 1): being printed large adds nothing;
#   - a `title` phrase counts once, at its best zone: title zone x zone_weights.title, footer x zone_weights.footer;
#   - score = min(sum, full) / full, so listing more alternatives never lowers a score;
#   - a `warning` phrase in the title zone rules the part or type out; elsewhere it takes its weight off the sum;
#   - a part with `needs_title` scores 0 unless one of its title phrases is in the title zone.
# A type marked `default` takes the pages of the parts it shares when no look-alike's own words claim them.
# A type decides between look-alikes over the run of pages its parts form: its own `title`, `content` and `warning`
# phrases are scored over the run like a part's, and a type with `needs_part` takes the run only when one of those
# parts is in it (an income tax return needs its computation or its form; an acknowledgement alone is its own type).
# A run may carry two types when both qualify (an acknowledgement filed with its computation: both).
# `unverified: true` marks a type drafted without a sample page; its lists are a first guess.
# A page takes a part when the part's score reaches `page_threshold` and leads the next part by `margin`.

settings:
  classifier: keywords       # keywords | signals: which scorer types documents (signals.yaml until Epic 3 passes)
  model_guard_min_score: 0.2 # the model's choice stands only when the document shows this much of that type's words
  zones:
    header_band: 0.12        # top share of the page height
    footer_band: 0.08        # bottom share
    # A title line is a line that is not a table row and either sits in the header band, or stands out in print:
    title_size_ratio: 1.15   # digital page: font size at least this times the page's body size (the size most characters use)
    title_bold_share: 0.6    # digital page: at least this share of the line's characters in a bold face
    title_height_ratio: 1.3  # scanned page (no font data): letters at least this times taller than the page's typical line
  zone_weights: {title: 3, footer: 2}   # what a title phrase counts for in each zone; content phrases count their weight anywhere
  full: 6                    # a part with this much evidence scores 1.0 (a part may set its own)
  page_threshold: 0.5
  margin: 0.15
  fuzzy: {min_length: 8, min_ratio: 0.88}   # a near spelling: about one wrong letter in 8, word by word
  categories:
    first_pages: 3           # N: categories are scored on the first N pages, then the next N if none qualifies
    threshold: 0.5           # a category qualifies when one of its types' parts scores this on those pages
  max_gap: 2                 # longest run of unplaced pages filled from same-type neighbours
  index_min_types: 3         # a page whose titles name this many parts, of more than one document type, is a cover or index page


# Field confidence (docs/functional-requirements.md F-17.1):
#   confidence = min(applicable caps) x sum(weight_i x component_i)
# Components are each in [0, 1]. A model's self-reported confidence is never
# a component. Interim values, calibrated on RBL's documents.

weights:
  classification: 0.15
  page_grade: 0.20
  reading_trust: 0.20      # text layer spot-check, or OCR word confidence
  validation: 0.25         # checksum, format, footing, running balance
  agreement: 0.20          # two reads agree (deterministic and model, or two passes)

caps:
  checksum_fail: 0.30
  not_found_on_page: 0.40
  grade_c_page: 0.60
  anchor_zone_only: 0.75

key_field_review_threshold: 0.80
manual_entry_cap: 0.70

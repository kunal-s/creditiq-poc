# Role catalogue and the seeded sign-in directory for this POC instance.
# Checked against the private stakeholder-name list before being added
# (CLAUDE.md rule 3; plan.md C11/C12) — none of these names are real RBL
# staff or the fictional picks the checklist excludes.
#
# This is authored config, not the runtime-editable policy/checklist/rules
# store: nothing here changes without a new commit (plan.md section 3).

roles:
  - id: analyst
    label: Credit Analyst
  - id: rm
    label: Relationship Manager
  - id: credit-manager
    label: Credit Manager
  - id: cco
    label: Chief Credit Officer
  - id: admin
    label: Administrator
  - id: compliance
    label: Compliance and Audit

# Nav groups each role may see. Anything not listed here is not rendered
# for that role (FR-19 role gating).
navByRole:
  analyst: [workbench, intake, appraisal, portfolio, governance]
  rm: [workbench, intake, appraisal, portfolio]
  credit-manager: [workbench, intake, appraisal, portfolio, governance]
  cco: [workbench, intake, appraisal, portfolio, governance, admin]
  admin: [admin, governance]
  compliance: [governance]

# Every seeded user signs in with this shared password — a POC convenience,
# shown on the sign-in screen itself; no real data exists behind it yet.
# Hash format: pbkdf2_sha256$<iterations>$<base64 salt>$<base64 digest>.
auth:

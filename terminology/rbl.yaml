  emptyTitle: No checks yet
  emptyDescription: The cross-checks run once documents have been read and their values extracted.
  header:
    spread: Spread
    queue: Exception queue
    continue: Continue to draft
    continueBlocked: Submission is blocked until every blocking discrepancy is accepted or dismissed.
  banner:

# Document checklist taxonomy: what's required, by constitution and by case
# attribute. Items are those the nine configured document types can satisfy (AD-2a);
# an item is added here together with a type that satisfies it. Consumed by engine/checklist.py's deriver, never read directly
# by the checklist screens — those go through the published config store.
#
# coverage: what "complete" means beyond presence (F-13.2), measured from
# the case's as_of date. request: how to ask for the item when it is
# missing, in plain language for the pre-login query list (F-14.2).

sections:
  - "Constitution and KYC"
  - Financials
  - "Banking and operations"

section_weight:
  "Constitution and KYC": 20
  Financials: 30
  "Banking and operations": 30

review_gate_threshold: 85
disbursement_gate_threshold: 100

items:
  # --- Constitution and KYC ---
  - id: coi
    name: Certificate of incorporation
    category: "Constitution and KYC"
    constitutions: [private_limited]
    why: Establishes legal existence and the date from which the borrowing entity has existed.
    basis: Companies Act constitution requirement.
    source: published_policy
    blocking: true
    weight: 5
    request: Certificate of incorporation of the company

  - id: moa_aoa
    name: Memorandum and Articles of Association
    category: "Constitution and KYC"
    constitutions: [private_limited]
    why: Establishes the objects clause and borrowing powers.
    basis: Companies Act constitution requirement.
    source: published_policy
    blocking: true
    weight: 4
    request: Memorandum and Articles of Association of the company

  - id: board_resolution
    name: Board resolution authorising the facility
    category: "Constitution and KYC"
    constitutions: [private_limited]
    why: Evidences the company's authority to borrow and who may sign.
    basis: Companies Act, delegation of powers.
    source: published_policy
    blocking: true
    weight: 4
    request: Certified copy of the board resolution authorising the borrowing, signed

  - id: pan_entity
    name: Entity PAN
    category: "Constitution and KYC"
    constitutions: [private_limited, proprietorship, partnership]
    why: Primary tax identifier; cross-checked against every other filing.
    basis: RBL KYC policy.
    source: published_policy
    blocking: true
    weight: 3
    request: PAN card of the borrowing entity

  - id: kyc_promoters
    name: KYC of directors, partners or proprietor
    category: "Constitution and KYC"
    constitutions: [private_limited, proprietorship, partnership]
    why: Identity and address verification of the people behind the borrower.
    basis: RBL KYC policy.
    source: published_policy
    blocking: true
    weight: 4
    coverage: {kind: parties}
    request: KYC (PAN and address proof) of every director, partner or proprietor

  # --- Financials ---
  - id: fs_fy_minus2
    name: Audited financial statements, second-latest year
    category: Financials
    constitutions: [private_limited, proprietorship, partnership]
    why: Establishes the trend line behind the latest audited year.
    basis: RBL credit policy, minimum audited history.
    source: published_policy
    blocking: true
    weight: 5
    coverage: {kind: financial_year, offset: 2, statements: [balance_sheet, profit_and_loss]}
    request: Audited financial statements

  - id: fs_fy_minus1
    name: Audited financial statements, latest year
    category: Financials
    constitutions: [private_limited, proprietorship, partnership]
    why: The primary basis for the spread and ratio assessment.
    basis: RBL credit policy, minimum audited history.
    source: published_policy
    blocking: true
    weight: 6
    coverage: {kind: financial_year, offset: 1, statements: [balance_sheet, profit_and_loss]}
    request: Audited financial statements

  - id: itr
    name: Income Tax Return with computation, latest assessment year
    category: Financials
    constitutions: [private_limited, proprietorship, partnership]
    why: Independent corroboration of profit and tax paid.
    basis: RBL credit policy.
    source: published_policy
    blocking: true
    weight: 4
    coverage: {kind: assessment_years, count: 2}
    request: Income-tax return acknowledgement with computation of income

  # --- Banking and operations ---
  - id: bank_statements
    name: Bank statements, twelve months, all operative accounts
    category: "Banking and operations"
    constitutions: [private_limited, proprietorship, partnership]
    why: Independent evidence of turnover and conduct.
    basis: RBL credit policy.
    source: published_policy
    blocking: true
    weight: 8
    coverage: {kind: account_months, months: 12}
    request: Bank statements

  - id: gst_returns
    name: GSTR-3B, twelve months
    category: "Banking and operations"
    constitutions: [private_limited, proprietorship, partnership]
    why: Independent evidence of turnover, cross-checked against books and bank credits.
    basis: RBL credit policy.
    source: published_policy
    blocking: true
    weight: 8
    coverage: {kind: monthly_periods, months: 12}
    request: GST returns (GSTR-3B)

# Fact alignment before cross-checking (docs/functional-requirements.md
# F-18). Interim proposals until RBL confirms its own conventions. Matching
# on narrations is case-insensitive and on whole words or phrases.

# The first month of the financial year (April in India). Annual, GST and
# bank figures are brought to this window (F-18.1).
financial_year_start_month: 4

# Credits removed before the remainder counts as business inflow (F-18.2). A credit is filed under a
# category by config/txn_classification.yaml (the rules, then the model, then a person); the categories
# listed here are the ones removed. Every exclusion is kept with its transaction.
bank_credit_exclusions:
  - {id: own_account_transfer, label: Transfer between the borrower's own accounts, categories: [own_transfer_in]}
  - {id: loan_disbursal, label: Loan disbursal, categories: [loan_disbursal]}
  - {id: reversal, label: Reversal or refund, categories: [reversal_refund]}
  - {id: returned_cheque, label: Returned cheque or failed debit, categories: [failed_debit_reversal]}

# A debit filed under loan_emi is a loan instalment. A lender debited in at least `emi_min_occurrences`
# months, with amounts within `emi_amount_match` of each other (config/tolerances.yaml), is an inferred
# obligation (F-18.4).

# The names under which a board resolution for borrowing is in favour of
# this bank (BR-03). Compared after the noise words below are removed.
own_bank_names: ["RBL Bank Limited", "RBL Bank", "Ratnakar Bank Limited"]

# Words removed from lender and firm names before comparing them (F-18.3),
# so "Lotuscrest Bank Ltd" and "LOTUSCREST BANK LIMITED" resolve to one.
name_noise_words: ["bank", "ltd", "limited", "pvt", "private", "co", "company", "finance", "financial", "services", "nbfc", "the"]

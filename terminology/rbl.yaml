    documents: Quality and classification
    extraction: Extraction
    completeness: Validation and completeness
    cross_verification: Cross-verification
    policy: Policy checks
    outputs: Outputs
  status:
    not_started: Not started
    in_progress: In progress
    needs_attention: Needs attention
    done: Done
  count:
    documents: "{done} of {total} documents classified"
    extraction: "{done} of {total} documents extracted"
    completeness: "{done} of {total} items satisfied"
  attention: "{n} need attention"
  waiting:
    documents: No documents yet
    other: Waiting for the stages before it

page:
  help:
    eyebrow: Help
    title: Guide to the steps
    purpose: What each step of an appraisal does, what the statuses mean and what is asked of you.
    stepsTitle: The steps
    statusTitle: What the statuses mean
    step:
      documents:
        title: Files
        body: Every file you upload is checked for readability and identified as a kind of document. A file that cannot be read is sent back with a request for a clearer copy.
      extraction:
        title: Extracted data
        body: The figures and details printed on each document are read out and shown next to the page they came from. Check anything marked for review.
      completeness:
        title: Completeness
        body: The documents received are compared with those the facility needs. What is missing, stale or incomplete is listed with the request to send to the customer.
      crossVerification:
        title: Cross-checks
        body: The same fact is compared across documents, for example a name or a turnover figure. Differences are listed with both values for you to accept or reject.
      policy:
        title: Policy
        body: The application is measured against each credit policy norm, with the required and the actual value side by side.
      outputs:
        title: Outputs
        body: The interim spread, the draft credit memo and the personal discussion questions, each figure linked to its source.
    status:
      not_started: The step has not begun, usually because an earlier step is still running.
      in_progress: The step is running now. It updates on its own.
      needs_attention: "Something needs a person: a document, a value or a decision."
      done: The step is complete.
  home:
    title: Credit Workbench
    purpose: Every application in progress, with its stage and the items waiting for review.
    greeting: "Welcome, {name}"
    counter:
      inProgress: Applications in progress
      inProgressSub: "Borrowers: {n}"
      review: Open review items
      reviewSub: waiting for a decision
    inFlight: Appraisals
    inFlightSub: Every appraisal you can see, with its stage and review items
    attention: Needs attention
    attentionCount: "{n} open"
    attentionEmpty: Nothing is waiting for a decision.
    filter:
      open: All open appraisals
      mine: Mine
      review: With review items
  newApplication:
    eyebrow: Appraisals
    title: New appraisal
    purpose: Paste the sourcing email or notes. CreditIQ proposes the application; nothing is created until you confirm it.
  overview:
    title: Overview
    next: Next
    nextNone: Nothing is waiting. Processing is up to date.
    nextUpload: Upload the borrower's documents to start processing.
    open: Open
    stillNeeded: Still needed
    stillNeededCount: "{n} checklist item(s) missing or insufficient"
    nothingNeeded: Every checklist item is satisfied or waived.
    waiting: Waiting for a decision
    waitingCount: "{n} open review item(s) on this appraisal"
    more: "{n} more"
  checklist:
    title: Required document set
    purpose: The checklist derived from the case's constitution and facilities, with each item satisfied, insufficient or missing.
  validation:
    title: Machine checks by document
    purpose: Every document received, its quality, what it was identified as, and each check it passed or failed.
  readiness:
    title: Readiness
    purpose: How complete the file is against the review gate, and what is still blocking.
  queries:
    title: Pre-login query list
    purpose: Everything needed from the customer, in one list the RM can send in one go.
  identity:
    title: Entity and parties
    purpose: The borrower's identifiers and the promoters, directors or partners, each with the document it came from.
  documents:
    title: Documents
    purpose: Every file received, how it was split, and where each document is. Anything that needs a person is flagged on its row, with what to do.
  data:
    title: Extracted data
    purpose: Key fields by source, each with its confidence and a link to the page it came from.
  spread:
    title: Financial spread
    purpose: The financial statements laid out by year, with ratios and the working-capital assessment, every figure traceable to its page.
  crossVerification:
    title: Cross-verification and discrepancy
    purpose: Every source lined up against every other, with the evidence on both sides of each finding.
  policy:
    title: Policy norms and deviations
    purpose: RBL's norms evaluated for this case, and each deviation with the norm, the actual value and its source.
  draft:
    title: CAM draft and PD note
    purpose: The draft Credit Approval Memo, and the questions for the personal discussion, every statement traceable to its page.
  comparison:
    title: Comparison with RBL's record
    purpose: This case's output beside the assessment RBL credit made at the time, for adjudication.
  exceptions:
    eyebrow: Governance
    title: Review queue
    purpose: Everything waiting for a person across cases, with the decision each one needs.
  scorecard:
    eyebrow: Governance
    title: Scorecard
    purpose: The success criteria, per case and across the case set.
  signIn:
    title: Sign in

signIn:
  email: Email
  password: Password
  submitting: Signing in…
  failed: Sign-in failed
  failedHelp: Check the email and password and try again.
  help: Use your bank email address and the password issued to you.

# Designed states shared by every screen.
state:
  loading: Loading
  notAvailable:
    title: Not available yet
    description: This part of the service is being switched on. Nothing has been lost; it appears here as soon as it is live.
  forbidden:
    title: Not part of your role
    description: Your role does not include this view. Ask a credit analyst or credit manager if you need it.
  notFound:
    title: Not found
    description: It does not exist, or it is not assigned to you.
  noConfig:
    title: Configuration not published
    description: The checklist and document configuration has not been published yet. An administrator publishes it from the command line.
  invalid:
    title: Not accepted
    description: The service did not accept this request. Check the values and try again.
  conflict:
    title: Not done
    description: This conflicts with the current state of the case.
  unreachable:
    title: The service is not reachable
    description: CreditIQ cannot reach the case service right now. Check the connection, then try again.
  failed:
    title: Something went wrong
    description: The service could not complete this request. Try again in a moment.
  caseNotFound:
    title: "No application {id}"
    description: It does not exist, or it is not assigned to you.
  noCases:
    title: No applications yet
    description: Applications appear here once they are created.
  pageNotFound:
    title: Page not found
    description: This page does not exist or has moved.
  pageFailed:
    title: This page did not load
    description: Something went wrong while opening it. Try again, or go back to the workbench.
  pending:
    title: Nothing to show yet
    description: This view fills in once the case has been processed this far.


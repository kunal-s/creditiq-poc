# Document type signals (FRD F-09). Regexes are case-insensitive and multiline, and are matched
# against normalised text (dashes folded to "-", ligatures and invisible characters removed).
#
# A type is recognised from three kinds of evidence:
#   required    a list of requirements, ALL of which must be met. A requirement is met when ANY of its
#               alternatives matches, so a document that words its title differently still qualifies.
#               `zone: head` limits the match to the opening lines of a page (where a document names
#               itself), so a passing mention in the body is not enough.
#   supporting  each match adds its `weight` (default 1) to the corroboration; `corroboration` (below, or
#               per type) is the total that counts as full. Score = 0.5 + 0.5 x min(1, matched / corroboration),
#               so adding alternatives to a list never lowers a document's score.
#   contrary    any match blocks a tier-1 exit for the type; `zone: head` limits it to a page's opening
#               lines, so a note deep in the body cannot rule a document out.
#   instances   a file may hold several instances of one type. `start`: a page matching it opens one.
#               `key_pattern`: a page naming a different value for the key opens one, and pages that
#               name none stay with the one before (so rewording a page never splits a document).
# Fragments written once under `patterns` are used as {NAME} inside any regex.
# Interim values, tuned against RBL's documents once they arrive.
tier1_margin: 0.2
classify_threshold: 0.6
corroboration: 3           # supporting weight that counts as full corroboration
tier2_confidence: 0.7      # fixed score for a tier-2 assignment (a model's own confidence is never used)
tier2_guard:                # the model's choice must still agree with the type's own signals
  block_on_contrary: true
  min_required_fraction: 0.5
signal_pages: 20           # non-blank pages read for classification
head_lines: 6              # opening lines of a page that count as its title zone
mixed_content_check: true  # flag a file whose pages match a different type
mixed_min_score: 0.75

patterns:
  PAN: '\b[A-Z]{5}\d{4}[A-Z]\b'
  GSTIN: '\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'
  CIN: '\b[LU]\d{5}[A-Z]{2}\d{4}[A-Z]{3}\d{6}\b'
  IFSC: '\b[A-Z]{4}0[A-Z0-9]{6}\b'

types:
  certificate_of_incorporation:
    required:
      - {any: ['certificate\s+of\s+incorporation'], zone: head}
    supporting:
      - 'registrar\s+of\s+companies'
      - 'corporate\s+identity\s+number'
      - '{CIN}'
      - 'companies\s+act'
      - 'ministry\s+of\s+corporate\s+affairs'
      - 'is\s+(this\s+day\s+)?incorporated'
    contrary: ['memorandum\s+of\s+association\s+of', 'resolved\s+that', 'statement\s+of\s+account']

  memorandum_articles_of_association:
    required:
      - {any: ['memorandum\s+of\s+association', 'memorandum\s+and\s+articles\s+of\s+association', 'articles\s+of\s+association\s+of'], zone: head}
    supporting:
      - 'name\s+clause'
      - 'objects?\s+clause'
      - 'liability\s+clause'
      - 'capital\s+clause'
      - 'subscription\s+clause'
      - 'articles\s+of\s+association'
      - 'we,?\s+the\s+several\s+persons|subscribers?'
    contrary: ['certificate\s+of\s+incorporation\s*$', 'resolved\s+that']

  company_pan:
    required:
      - any: ['intimation\s+of\s+allotment\s+of\s+(permanent\s+account\s+number|pan)', 'permanent\s+account\s+number\s+(card|allotment)', 'pan\s+(card|allotment|intimation)', '\be-?pan\b']
        zone: head
    supporting:
      - 'income\s+tax\s+department'
      - 'assessing\s+officer'
      - 'permanent\s+account\s+number\s+\(pan\)'
      - '{PAN}'
      - 'form\s+49a'
    contrary:
      - 'director\s+kyc'
      - 'certificate\s+of\s+incorporation\s*$'
      - {rx: 'income[\s-]*tax\s+return|assessment\s+year', zone: head}

  director_kyc:
    required:
      - {any: ['director\s+kyc', 'dir-?3\s+kyc', 'kyc\s+of\s+(the\s+)?director'], zone: head}
    supporting:
      - 'director\s+identification\s+number|\bdin\b'
      - 'residential\s+address'
      - 'relationship\s+with\s+company'
      - 'aadhaar'
      - '{PAN}'
    contrary: ['certificate\s+of\s+incorporation\s*$', 'memorandum\s+of\s+association\s+of']
    instances:
      start: 'director\s+kyc\s+summary\s+sheet'
      keys: [person_name]

  board_resolution_borrowing:
    required:
      - any: ['certified\s+true\s+copy', 'extract\s+(from|of)\s+the\s+minutes', 'board\s+resolution', 'resolution\s+(passed|adopted)', 'minutes\s+of\s+(the\s+)?(meeting\s+of\s+the\s+)?board']
        zone: head
    supporting:
      - {rx: 'resolved\s+(further\s+)?that', weight: 2}
      - 'board\s+of\s+directors'
      - 'section\s+179'
      - {rx: 'borrow', weight: 2}
      - 'authori[sz]ed\s+to\s+execute'
    contrary: ['declaration\s+of\s+nil', 'memorandum\s+of\s+association\s+of']

  audited_financial_statements:
    required:
      # The last alternative is the opening block of statements filed in XBRL, whose statements start well past the pages read here.
      - any: ['audited\s+(standalone\s+|consolidated\s+)?(financial\s+statements|accounts)', 'independent\s+auditor', 'balance\s+sheet\s+as\s+(at|on)', 'financial\s+statements\s+for\s+the\s+(year|period)', '^\[700300\]\s+disclosure\s+of\s+general\s+information\s+about\s+company']
        zone: head
    supporting:
      - {rx: 'independent\s+auditor', weight: 2}
      - {rx: '^\s*level\s+of\s+rounding\s+used\s+in\s+financial\s+statements\b', weight: 2}
      - 'balance[\s-]*sheet'
      - 'statement\s+of\s+profit\s+and\s+loss'
      - 'cash[\s-]*flow\s+statement'
      - 'firm\s+registration'
    contrary:
      - 'unaudited'
      - 'provisional\s+financial'
      - 'statement\s+of\s+account'
      - {rx: 'income[\s-]*tax\s+return|form\s+itr', zone: head}
    # Two years' statements in one file are two instances, told apart by the date a page's heading names
    # ("for the year ended 31 March 2026", "balance sheet as at 31 March 2026"). Read from the heading only:
    # notes and comparative columns name last year too. An MCA XBRL rendition prints its period in every
    # page header, which then alone decides. Pages before the first dated heading (the auditor's report)
    # belong to the first instance, not front matter.
    instances:
      zone: head
      leading: first
      first_key_pattern: 'financial\s+statements\s+for\s+period\s+\S+\s+to\s+(\d{1,2}/\d{1,2}/20\d{2})'
      key_pattern: '(?:year\s+ended|as\s+at)\s+(\d{1,2}(?:st|nd|rd|th)?\s+(?:january|february|march|april|may|june|july|august|september|october|november|december),?\s+20\d{2})'
      keys: [financial_year]

  income_tax_return:
    required:
      - any: ['income[\s-]*tax\s+return', 'form\s+itr[\s-]*\d?', '\bitr[\s-]*(v|[1-7])\b', 'return\s+of\s+income', 'itr\s+acknowledg(e)?ment', 'acknowledg(e)?ment\s+of\s+(receipt\s+of\s+)?(income[\s-]*tax\s+)?return']
        zone: head
      - any: ['assessment\s+year', '\bAY\s*20\d{2}', 'previous\s+year']
      # The return or its computation itself, so an acknowledgement on its own is an ITR acknowledgement (decision 14).
      - any: ['computation\s+of\s+(total\s+)?income', 'gross\s+total\s+income', 'part\s+b[\s-]*ti\b', 'form\s+itr[\s-]*[1-7]\b', 'return\s+of\s+income']
    supporting:
      - 'assessment\s+year'
      - 'form\s+itr'
      - 'e-?filing\s+acknowledg(e)?ment'
      - 'computation\s+of\s+(total\s+)?income'
      - 'acknowledg(e)?ment\s+(no|number)'
      - 'income[\s-]*tax\s+department'
      - 'gross\s+total\s+income'
      - 'section\s+139'
      - 'date\s+of\s+filing'
      - '{PAN}'
    contrary: ['statement\s+of\s+account']
    instances:
      first_key_pattern: '^\s*acknowledg(?:e)?ment\s+(?:number|no\.?)\s*:\s*(\d{12,})'   # printed in every page header of a return
      key_pattern: 'assessment\s+year\s*:?\s*(?:[^\n]*\n[^\n]*?)?(20\d{2})'
      keys: [assessment_year]

  gstr_3b:
    required:
      - {any: ['form\s+gstr[\s-]*3b', 'gstr[\s-]*3b\s+(return|summary)', 'monthly\s+return\s+\(gstr[\s-]*3b\)'], zone: head}
    supporting:
      - '\barn\b'
      - 'return\s+period'
      - 'outward\s+taxable\s+supplies'
      - '{GSTIN}|\bgstin\b'
      - 'eligible\s+input\s+tax\s+credit'
      - 'table\s+3\.1'
    contrary: ['statement\s+of\s+account']
    instances:
      start: 'form\s+gstr[\s-]*3b'
      keys: [tax_period, financial_year]

  gstr_1:
    required:
      - {any: ['form\s+gstr[\s-]*1\b', 'details\s+of\s+outward\s+supplies\s+of\s+goods\s+or\s+services'], zone: head}
    supporting:
      - '\brule\s+59\(1\)'
      - 'taxable\s+outward\s+supplies'
      - '\bb2b\b'
      - '{GSTIN}|\bgstin\b'
      - '\barn\b'
      - 'no\.\s+of\s+records'
    contrary: ['statement\s+of\s+account', 'form\s+gstr[\s-]*3b']
    instances:
      start: 'form\s+gstr[\s-]*1\b'
      keys: [tax_period, financial_year]

  # A declaration of nil facilities is a declaration of existing facilities that declares none.
  existing_facilities_declaration:
    required: ['declaration\s+of\s+(nil\s+)?existing\s+(credit\s+)?facilit']
    supporting: ['hereby\s+(solemnly\s+)?declare', 'existing\s+credit\s+facilities', 'name\s+of\s+lender', 'nature\s+of\s+facility', '\boutstanding\b', 'banking\s+(relationship|arrangements?)']
    contrary: ['statement\s+of\s+account', 'resolved\s+(further\s+)?that', 'sanction\s+letter|letter\s+of\s+sanction', 'credit\s+information\s+report']

  sanction_letter:
    required: ['sanction\s+letter|letter\s+of\s+sanction']
    supporting: ['pleased\s+to\s+sanction', 'sanctioned\s+amount', 'rate\s+of\s+interest', '\btenure\b', 'equated\s+monthly|\bemi\b', 'terms\s+and\s+conditions']
    contrary: ['statement\s+of\s+account', 'resolved\s+(further\s+)?that', 'declaration\s+of\s+(nil\s+)?existing', 'credit\s+information\s+report']

  commercial_bureau_report:
    required: ['commercial\s+credit\s+information\s+report|company\s+credit\s+(information\s+)?report']
    supporting: ['credit\s+rank', 'credit\s+facilities', '\boverdue\b', 'related\s+parties', 'report\s+date', 'days\s+past\s+due|\bdpd\b']
    contrary: ['statement\s+of\s+account', 'sanction\s+letter|letter\s+of\s+sanction', 'declaration\s+of\s+(nil\s+)?existing']

  bank_statement:
    required:
      - any: ['statement\s+of\s+account', 'account\s+statement', 'statement\s+of\s+(bank\s+)?transactions', 'bank\s+statement', 'transaction\s+(history|statement)', 'statement\s+for\s+(the\s+)?(period|account)']
        zone: head
    supporting:
      - {rx: '(withdrawal|debit)[^\n]{0,50}(deposit|credit)[^\n]{0,50}balance', weight: 3}
      - 'opening\s+balance'
      - 'closing\s+balance'
      - '{IFSC}|\bifsc\b'
      - 'debit\s+\(inr\)'
      - 'credit\s+\(inr\)'
      - 'account\s+(number|no)'
      - 'branch'
      - 'narration|particulars'
      - 'value\s+date'
    contrary: ['gstr-?3b\s+returns', {rx: 'form\s+gstr', zone: head}]

  # ---- Types added for the restructure (decision 14). Interim title patterns in today's format, so each type can be
  # placed until the keyword lists of Stories 1.3 and 1.4 replace them (Epic 2). Each is switched on or off by
  # `enabled` in document_types.json.
  provisional_financial_statements:
    required:
      - any: ['provisional\s+(financial\s+statements|accounts|balance\s+sheet|statement\s+of\s+profit)', 'unaudited\s+(financial\s+statements|accounts)']
        zone: head
    supporting:
      - {rx: 'provisional', weight: 2}
      - 'balance[\s-]*sheet'
      - 'statement\s+of\s+profit\s+and\s+loss'
      - 'unaudited'
      - '(nine|six|three)\s+months|half[\s-]*year|period\s+ended'
      - '{CIN}'
    contrary: ['independent\s+auditor', 'projected', 'statement\s+of\s+account']

  projected_financial_statements:
    required:
      - any: ['projected\s+(financial\s+statements|balance\s+sheet|profit|statement)', 'financial\s+projections', 'estimated\s+and\s+projected']
        zone: head
    supporting:
      - {rx: 'projected', weight: 2}
      - 'estimated'
      - 'balance[\s-]*sheet'
      - 'profit\s+and\s+loss|profitability'
      - 'assumptions'
    contrary: ['independent\s+auditor', 'credit\s+monitoring\s+arrangement', 'statement\s+of\s+account']

  cma_data:
    required:
      - any: ['credit\s+monitoring\s+arrangement', '\bcma\s+(data|statement|report)', 'maximum\s+permissible\s+bank\s+finance']
        zone: head
    supporting:
      - 'operating\s+statement'
      - 'analysis\s+of\s+balance\s+sheet'
      - 'comparative\s+statement\s+of\s+current\s+assets'
      - 'maximum\s+permissible\s+bank\s+finance|\bmpbf\b'
      - 'fund\s+flow'
      - '\bform\s+(ii|iii|iv|v|vi)\b'
    contrary: ['statement\s+of\s+account']

  stock_statement:
    required:
      - any: ['stock\s+(and\s+book[\s-]*debts?\s+)?statement', 'statement\s+of\s+stock', 'drawing\s+power\s+(statement|calculation)']
        zone: head
    supporting:
      - 'book[\s-]*debts?'
      - 'raw\s+materials?'
      - 'work\s+in\s+progress'
      - 'finished\s+goods'
      - 'drawing\s+power'
      - 'hypothecation'
      - 'sundry\s+(debtors|creditors)'
    contrary: ['statement\s+of\s+account', 'balance\s+sheet\s+as\s+(at|on)', 'independent\s+auditor']

  gstr_9:
    required:
      - any: ['gstr[\s-]*9(?![\s-]*c)\b', 'form\s+gstr[\s-]*9(?![\s-]*c)\b']
        zone: head
      - any: ['annual\s+return', 'financial\s+year']
    supporting:
      - 'annual\s+return'
      - 'outward\s+supplies'
      - 'details\s+of\s+tax\s+paid'
      - 'pt\.?\s*ii|part\s+ii'
      - '{GSTIN}'
    contrary: ['gstr[\s-]*3b', 'gstr[\s-]*1\b', 'income[\s-]*tax\s+return']

  form_26as:
    required:
      - any: ['form\s*(no\.?\s*)?26\s*as', 'annual\s+tax\s+statement']
        zone: head
    supporting:
      - 'tax\s+deducted\s+at\s+source'
      - 'tan\s+of\s+deductor'
      - 'part\s+[a-h]\b'
      - 'assessment\s+year'
      - 'section\s+19[2-6]'
      - '{PAN}'
    contrary: ['statement\s+of\s+account', 'return\s+of\s+income']

  itr_acknowledgement:
    required:
      - any: ['income\s+tax\s+return\s+acknowledg(e)?ment', 'itr[\s-]*v\b', 'acknowledg(e)?ment\s+of\s+(receipt\s+of\s+)?(income[\s-]*tax\s+)?return']
        zone: head
      - any: ['assessment\s+year', '\bAY\s*20\d{2}']
    supporting:
      - 'acknowledg(e)?ment\s+(no|number)'
      - 'date\s+of\s+filing'
      - 'e-?filing'
      - 'verification'
      - 'total\s+income'
      - '{PAN}'
    # Until a page can carry two types (Epic 3), a file with the computation of income stays an income tax return.
    contrary: ['statement\s+of\s+account', 'computation\s+of\s+(total\s+)?income', 'gross\s+total\s+income', 'part\s+b[\s-]*ti\b']

  partnership_deed:
    required:
      - any: ['deed\s+of\s+partnership', 'partnership\s+deed']
        zone: head
    supporting:
      - 'partners?'
      - 'name\s+of\s+the\s+firm|firm\s+name'
      - 'profit[\s-]*sharing\s+ratio|share\s+of\s+(the\s+)?profits?'
      - 'capital\s+contribution'
      - 'indian\s+partnership\s+act'
      - 'witness(es)?'
    contrary: ['memorandum\s+of\s+association', 'statement\s+of\s+account']

  udyam_registration:
    required:
      - any: ['udyam\s+registration\s+(certificate|number)']
        zone: head
    supporting:
      - {rx: 'UDYAM-[A-Z]{2}-\d{2}-\d{7}', weight: 2}
      - 'micro|small|medium'
      - 'major\s+activity'
      - 'national\s+industr(y|ial)\s+classification|\bnic\b'
      - 'ministry\s+of\s+micro'
    contrary: ['certificate\s+of\s+incorporation']

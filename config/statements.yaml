# Where the canonical financial lines are printed (docs/functional-requirements.md F-18, F-20, F-22).
# The document-processing service returns each statement as a table of its printed rows
# (balance_sheet, profit_and_loss, cash_flow: particulars, current_period, previous_period).
# A line is found by matching its label in the first column; derived lines are sums of
# other lines. Policy norms, the spread and the turnover facts all read these figures.
# Interim: re-map when RBL's statement layout and spread template arrive.

column: current_period

# The unit financial figures are written in on the screens, the memo and the exports: rupee, thousand,
# lakh or crore. An Administrator changes it on the Administration screen (a new published version).
display_unit: crore

lines:
  revenue_from_operations: {table: profit_and_loss, row: '^([IVX]+\.?\s*)?revenue from operations'}
  other_income:            {table: profit_and_loss, row: '^([IVX]+\.?\s*)?other income'}
  depreciation:            {table: profit_and_loss, row: '^depreciation'}
  finance_costs:           {table: profit_and_loss, row: '^finance costs?'}
  profit_before_tax:       {table: profit_and_loss, row: '^([IVX]+\.?\s*)?profit before tax'}
  profit_after_tax:        {table: profit_and_loss, row: '^([IVX]+\.?\s*)?(profit\s*[/(]*\s*\(?loss\)?\s*for the (year|period)|profit (for the (year|period)|after tax))'}
  share_capital:           {table: balance_sheet, row: '^\(\w\)\s*share capital'}
  reserves_and_surplus:    {table: balance_sheet, row: '^\(\w\)\s*reserves and surplus'}
  long_term_borrowings:    {table: balance_sheet, row: '^\(\w\)\s*long-term borrowings'}
  short_term_borrowings:   {table: balance_sheet, row: '^\(\w\)\s*short-term borrowings'}
  trade_payables:          {table: balance_sheet, row: '^\(\w\)\s*trade payables'}
  other_current_liabilities: {table: balance_sheet, row: '^\(\w\)\s*other current liabilities'}
  short_term_provisions:   {table: balance_sheet, row: '^\(\w\)\s*short-term provisions'}
  inventories:             {table: balance_sheet, row: '^\(\w\)\s*inventories'}
  trade_receivables:       {table: balance_sheet, row: '^\(\w\)\s*trade receivables'}
  cash_and_bank_balances:  {table: balance_sheet, row: '^\(\w\)\s*cash and (bank balances|cash equivalents)'}
  short_term_loans_and_advances: {table: balance_sheet, row: '^\(\w\)\s*short-term loans and advances'}
  other_current_assets:    {table: balance_sheet, row: '^\(\w\)\s*other current assets'}
  # The two totals a balance sheet must agree on; read for the spread's reconciliation, not worked from.
  total_assets:            {table: balance_sheet, row: '^total assets'}
  total_equity_and_liabilities: {table: balance_sheet, row: '^total (equity\s*(&|and)\s*liabilities|liabilities and equity)'}
  # Further Schedule III lines (document-fields). A statement that does not print one simply has no such line.
  share_application_money: {table: balance_sheet, row: '^\(\w\)\s*share application money'}
  deferred_tax_liability:  {table: balance_sheet, row: '^\(\w\)\s*deferred tax liabilit'}
  other_long_term_liabilities: {table: balance_sheet, row: '^\(\w\)\s*other long-term liabilities'}
  long_term_provisions:    {table: balance_sheet, row: '^\(\w\)\s*long-term provisions'}
  net_fixed_assets:        {table: balance_sheet, row: '^\(\w\)\s*(property, plant and equipment|tangible assets|fixed assets)'}
  capital_work_in_progress: {table: balance_sheet, row: '^\(\w\)\s*capital work-in-progress'}
  intangible_assets:       {table: balance_sheet, row: '^\(\w\)\s*intangible assets'}
  non_current_investments: {table: balance_sheet, row: '^\(\w\)\s*non-current investments'}
  deferred_tax_asset:      {table: balance_sheet, row: '^\(\w\)\s*deferred tax assets?'}
  long_term_loans_and_advances: {table: balance_sheet, row: '^\(\w\)\s*long-term loans and advances'}
  other_non_current_assets: {table: balance_sheet, row: '^\(\w\)\s*other non-current assets'}
  current_investments:     {table: balance_sheet, row: '^\(\w\)\s*current investments'}
  total_income:            {table: profit_and_loss, row: '^([IVX]+\.?\s*)?total (income|revenue)'}
  cost_of_materials_consumed: {table: profit_and_loss, row: '^cost of (raw )?materials? consumed'}
  purchases_of_stock_in_trade: {table: profit_and_loss, row: '^purchases? of stock-in-trade'}
  changes_in_inventories:  {table: profit_and_loss, row: '^changes in inventor'}
  employee_benefits_expense: {table: profit_and_loss, row: '^employee benefits? expenses?'}
  other_expenses:          {table: profit_and_loss, row: '^other expenses'}
  total_expenses:          {table: profit_and_loss, row: '^([IVX]+\.?\s*)?total expenses'}
  exceptional_items:       {table: profit_and_loss, row: '^([IVX]+\.?\s*)?exceptional'}
  tax_expense:             {table: profit_and_loss, row: '^([IVX]+\.?\s*)?tax expense'}
  cash_flow_from_operations: {table: cash_flow, row: '^net cash (generated )?(from|used in|\(used in\)|from\s*/\s*\(used in\))\s*operating activities'}

# Rows a statement may leave out when it has nothing to report; read as nil and marked not printed.
absent_is_nil: [inventories, other_current_assets]

derived:
  ebitda: profit_before_tax + finance_costs + depreciation
  net_worth: share_capital + reserves_and_surplus
  total_borrowings: long_term_borrowings + short_term_borrowings
  current_assets: inventories + trade_receivables + cash_and_bank_balances + short_term_loans_and_advances + other_current_assets
  current_liabilities: short_term_borrowings + trade_payables + other_current_liabilities + short_term_provisions

# GST turnover from table 3.1 of each GSTR-3B: every matching row is summed.
# (a) taxable, (b) zero rated and (c) nil rated or exempted outward supplies
# are sales; (d) inward reverse-charge and (e) non-GST supplies are not.
gst_outward: {table: outward_supplies, row: '^\((a|b|c)\)', column: taxable_value}

# The lines of an income tax return's computation compared with the books
# (TX-02 book profit, TX-03 turnover). Rows found by their printed label.
itr_lines:
  profit_before_tax: {table: income_computation, row: '(net )?profit (before tax )?as per (the )?(statement of )?(profit and loss|p\s*&\s*l)', column: amount}
  turnover:          {table: income_computation, row: '^(revenue from operations|gross receipts|turnover|sales turnover|total sales)', column: amount}

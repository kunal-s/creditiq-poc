# Deployment bootstrap configuration (read directly, like roles.yaml; not a
# published policy section). Operational settings the engine and the
# screens need; changing one needs no code change
# (docs/functional-requirements.md F-01, F-03, F-04, F-05).

# Case IDs (F-01.1). {prefix} is the product's `prefix`, {year} the creation year, {seq} a
# sequence kept per prefix and year. BBG numbers already issued continue unchanged.
case_id:
  format: "{prefix}-{year}-{seq:06d}"

# How a case arrived (F-04.1). Recorded as provenance, never integrated.
channels:
  - {id: email, label: Email}
  - {id: whatsapp, label: WhatsApp}
  - {id: phone_note, label: Phone note}
  - {id: walk_in, label: RM walk-in}
  - {id: other, label: Other}

# Constitutions a case can carry. "unknown" keeps the checklist provisional (F-12.3).
constitutions:
  - {id: private_limited, label: Private limited}
  - {id: partnership, label: Partnership}
  - {id: proprietorship, label: Proprietorship}
  - {id: unknown, label: Not yet confirmed}

# Facilities an application can request (F-04.2), and the checklist
# attribute each one sets (F-12.1). `aliases` are the words a sourcing
# message uses for the facility (F-04): an alias written in capitals only
# (CC, OD, TL) matches as a whole word in capitals; any other alias matches
# regardless of case.
facilities:
  - id: cash_credit
    label: Cash credit
    sets: cash_credit_requested
    aliases: [CC, C.C., cash credit, cash-credit]
  - id: overdraft
    label: Overdraft
    sets: cash_credit_requested
    aliases: [OD, overdraft, over draft]
  - id: wcdl
    label: Working capital demand loan
    sets: cash_credit_requested
    aliases: [WCDL, working capital demand loan, demand loan]
  - id: term_loan
    label: Term loan
    sets: term_loan_requested
    aliases: [TL, T.L., term loan, term-loan]
  - id: packing_credit
    label: Export packing credit
    sets: cash_credit_requested
    aliases: [EPC, PCFC, packing credit, pre-shipment credit, pre shipment credit]
  - id: post_shipment
    label: Post-shipment finance
    sets: cash_credit_requested
    aliases: [PSC, PSCFC, post-shipment, post shipment, export bill discounting]
  - id: bank_guarantee
    label: Bank guarantee
    sets: null
    aliases: [BG, PBG, FBG, bank guarantee, performance guarantee]
  - id: letter_of_credit
    label: Letter of credit
    sets: null
    aliases: [LC, L/C, ILC, FLC, letter of credit]

# Products a case can be opened under: the first choice on the New appraisal screen. Each
# product lists what a case of that product may carry (the lists name ids defined below) and
# the fields a case needs before it can be created (`minimum`, checked by the engine; what the
# form asks is in config/intake.yaml). `default` is pre-selected. Placeholders marked
# "RBL to confirm" are provisional until RBL supplies its own lists (plan 13, questions 1 to 5).
products:
  default: bbg
  options:
    - id: bbg
      label: Business banking
      prefix: BBG
      case_types: [new, renewal, enhancement, takeover]
      stages: [login, pd, sanction, post_sanction]
      # A business's customer type is its constitution.
      customer_types: [private_limited, partnership, proprietorship]
      programs: []
      minimum: [borrower, facilities, amount_inr]
    - id: lap
      label: Loan against property
      prefix: LAP
      case_types: [new, balance_transfer, balance_transfer_top_up, top_up]    # RBL to confirm
      stages: [login, pd, sanction, post_sanction]                            # RBL to confirm
      customer_types: [salaried, self_employed_professional, self_employed, non_individual]   # RBL to confirm
      programs: [income, banking_surrogate, gst_surrogate, rental]            # placeholders; RBL to provide
      minimum: [applicants, customer_type, amount_inr, tenure_months, properties]

# Customer types other than constitutions (a loan against property is made to an individual or a
# business). A product's `customer_types` name ids of `constitutions` or of this list.
customer_types:
  - {id: salaried, label: Salaried}
  - {id: self_employed_professional, label: Self-employed professional}
  - {id: self_employed, label: Self-employed (non-professional)}
  - {id: non_individual, label: Non-individual}

# Credit programs (a checklist dimension). Placeholders; RBL to provide.
programs:
  - {id: income, label: Income program}
  - {id: banking_surrogate, label: Banking surrogate}
  - {id: gst_surrogate, label: GST surrogate}
  - {id: rental, label: Rental income}

# What a value taken from the case header is called where it is cited (facts, cross-checks, the
# appraisal). A case with a sourcing message names the message; one without names the intake form.
# `label` names the source, `side` titles a cross-check's side, `phrase` is the source inside a sentence.
declared_sources:
  message: {label: Sourcing message, side: Declared in the sourcing message, phrase: the sourcing message}
  intake: {label: Declared at intake, side: Declared at intake, phrase: the intake form}

# Case types. A product lists the ones it uses (`products.options[].case_types`). `aliases` are
# the words a sourcing message uses for the type (F-04), matched like facility aliases: an alias in
# capitals only matches as a whole word in capitals, and only the product's own types are matched,
# so "balance transfer" is a takeover for business banking and a balance transfer for a loan
# against property. A case whose type is not yet confirmed carries "unknown". Provisional list.
case_types:
  - id: new
    label: New
    aliases: [fresh, new to bank, new-to-bank, NTB, first time]
  - id: renewal
    label: Renewal
    aliases: [renewal, renew, annual review, review and renewal]
  - id: enhancement
    label: Enhancement
    aliases: [enhancement, enhance, limit increase, increase in limit, additional limit]
  - id: takeover
    label: Takeover
    aliases: [takeover, take over, take-over, balance transfer, BT]
  - id: balance_transfer                       # loan against property; RBL to confirm
    label: Balance transfer
    aliases: [balance transfer, BT, takeover, take over, take-over]
  - id: balance_transfer_top_up                # loan against property; RBL to confirm
    label: Balance transfer with top-up
    aliases: [balance transfer with top up, balance transfer with top-up, BT with top up, BT with top-up, BT top-up, balance transfer and top up]
  - id: top_up                                 # loan against property; RBL to confirm
    label: Top-up
    aliases: [top up, top-up, topup, additional loan]
  - id: unknown
    label: Not yet confirmed
    aliases: []

# Branches a case can be booked at. A new case starts at the RM's branch
# (matched on label). `aliases` are the words a sourcing message uses for it.
branches:
  - {id: mumbai_hub, label: Mumbai hub, aliases: [Mumbai hub]}
  - {id: head_office, label: Head office, aliases: [Head office]}

# The bank's processing stages a case can be at. `default` is the stage a new
# case starts at. Provisional list.
bank_stages:
  default: login
  options:
    - {id: login, label: Login}
    - {id: pd, label: Personal discussion}
    - {id: sanction, label: Sanction}
    - {id: post_sanction, label: Post-sanction}

# Application and customer identifiers issued by the loan origination system.
# `pattern` is a regular expression for reading the identifier from a
# sourcing message (F-04); null means it is never read, only typed.
case_identifiers:
  application_id: {pattern: null}
  customer_id: {pattern: null}

# Fields a business banking case must have before it can be created (F-04.6): kept for callers
# that predate products. Each product's own minimum is `products.options[].minimum`.
case_create_minimum: [borrower, product, facilities, amount_inr]

# Upload limits (F-05.1, F-05.2). An archive is refused as a decompression
# bomb when it expands beyond max_archive_mb, or when any member expands
# more than max_compression_ratio times (members larger than 1 MB).
uploads:
  # The case's JSON part of the one-request create (POST /api/cases/intake), and any other text field
  # an upload keeps (its channel). A larger one is refused, never cut short; other fields are dropped.
  max_case_part_kb: 256
  max_form_field_kb: 4
  # One request in all: its parts (files and fields together) and its size, checked as it streams.
  max_parts: 1000
  max_request_mb: 1000
  max_file_mb: 50
  max_archive_mb: 500
  archive_depth: 3
  max_compression_ratio: 100
  max_archive_entries: 5000
  # System files listed as ignored (F-05.2). Matched against each path
  # component: exact names, name prefixes, and folder names.
  junk:
    names: [.DS_Store, Thumbs.db, desktop.ini, .localized]
    prefixes: ["~$", "._"]
    folders: [__MACOSX, .git, .svn]

# The rule-based message parser (F-04.9). Vocabulary only; the rules are in
# engine/proposal.py. Every word here is matched as a whole word.
proposal:
  company_suffixes: ["private limited", "pvt. ltd.", "pvt ltd", "pvt. ltd", "pvt.ltd.", "pvt.ltd", "(p) ltd", "(p) ltd.", "llp", "limited", "ltd", "ltd."]
  firm_suffixes: [traders, trading co, enterprises, industries, exports, impex, agencies, associates, "& co", "and co", "& sons", "and sons", brothers, textiles, foods, fabricators, castings, polymers, weaves, mills, works]
  name_stopwords: [the, a, an, of, for, from, to, and, is, are, our, with, by, in, "on", at, as, re, fwd, fw, subject, client, customer, borrower, company, firm, party, name, new, existing, group, sister, concern, unit, dear, sir, madam, hi, hello, please, pls, kindly, find, details, regarding, loan, limit, request, application, proposal, wants, want, needs, need, requires, require, hai, ka, ki, ke, ko, se, aur, bhi, wala, wali, this, that, these, its, it, his, her, their, account, a/c, promoter, promoters, director, directors, partner, partners, proprietor, md, mr, mrs, ms, shri, smt, dr, m/s, ms., via, about, approx, around, also, only, all, any, some, one, two, three]
  honorifics: [mr, mrs, ms, shri, smt, dr, sri, kumari]
  turnover_words: ["T/O", "turnover", "topline", "top line", "sales", "revenue"]
  turnover_capitals: ["TO"]
  request_words: [limit, loan, requirement, required, require, requires, requested, request, ask, need, needs, needed, chahiye, funding, proposal, proposed, sanction, enhancement, enhance, increase, wants, want, looking for]
  existing_words: [existing, currently, presently, already, enjoying, availing, running, banking with, account with, a/c with, "has a", "have a"]
  approximate_words: [approx, approx., approximately, appx, around, about, nearly, roughly, lagbhag, "~"]
  role_words:
    director: [director, directors, md, managing director, whole-time director]
    partner: [partner, partners]
    proprietor: [proprietor, owner, prop]
    promoter: [promoter, promoters, owners]
    guarantor: [guarantor, guarantors]

# Label hints (F-10.1): words in a file name or archive path that name a
# document type. A hint is never used to classify; it is compared with the
# classified type and a disagreement is reported. Regular expressions,
# matched case-insensitively against the hint.
label_keywords:
  bank_statement: ['bank\s*st(ate)?m(en)?t', 'statement\s+of\s+account', '\bsoa\b', '\bpassbook\b']
  audited_financial_statements: ['balance\s*sheet', 'audited', '\bfinancials?\b', '\bafs\b', '\bp\s*&?\s*l\b', 'profit\s*(and|&)?\s*loss']
  income_tax_return: ['\bitr\b', 'itr\s*-?\s*v', 'income\s*tax\s*return', 'computation']
  gstr_3b: ['gstr\s*-?\s*3b', '\b3b\b']
  gstr_1: ['gstr\s*-?\s*1\b']
  company_pan: ['\bpan\b']
  director_kyc: ['\bpan\b', 'kyc', 'aadhaa?r', 'passport', 'voter', 'driving', 'licen[cs]e']
  certificate_of_incorporation: ['incorporation', '\bcoi\b']
  memorandum_articles_of_association: ['\bmoa\b', '\baoa\b', 'memorandum', 'articles']
  board_resolution_borrowing: ['resolution', '\bbr\b']
  existing_facilities_declaration: ['declaration', 'existing\s+facilit', 'nil\s+facilit']
  sanction_letter: ['sanction']
  commercial_bureau_report: ['bureau', '\bcmr\b', '\bccr\b', 'credit\s+(information\s+)?report']

# Plain-language phrasing of the pre-login query list (F-14.2). Placeholders
# are filled by engine/queries.py.
query_phrasing:
  missing: "{request}."
  gap: "{request}."
  redo: "{name}: {deficiency}. Please provide a corrected copy."
  outdated: "{name} dated within the last {max_age_days} days (the copy received is dated {date})."
  quality: "{document}: {request}"
  label: "The file \"{file}\" is named as {label} but contains {content}. Please confirm it was sent as intended."
  party_refiled: "The file \"{file}\" is named for {label_party} but carries the details of {party}. Please confirm whose document it is."
  party_conflict: "The file \"{file}\" carries the identity number of {party} but the name of {label_party}. Please confirm whose document it is."
  party_unmatched: "The file \"{file}\" ({content}) does not match anyone on this application. Please confirm whose document it is and how they are connected to the borrower."
  # A required field (config/ingestion/fields.yaml required_fields) no document received shows (F-13.6).
  required_field: "{field} is not shown in the documents received{stops}. Please provide it."
  required_field_stops: "; without it {stops} cannot be worked out"

# What a document held for review is described as, when it has no reason code of its own.
rejection_phrasing:
  type_not_recognised: "The document type could not be recognised."
  held: "The document is held for review."

# Features a deployment switches on or off. Off, the screens show nothing of the feature and the
# counts they show leave it out; what the engine has recorded is kept, so switching it back on
# shows it all again. Read on each request: a change here needs no restart of the engine.
features:
  # File integrity checks (F-07A): the Integrity check column and panel on Files, the detailed
  # evidence page, the marks in the document viewer, and the integrity review items.
  integrity_checks: false
  # Model usage (Administration): tokens, cost, calls, errors and latency of every model call, read
  # from the model call logs of the document service, the engine and the case assistant.
  model_usage: true

# Model usage (Administration > Model usage).
model_usage:
  default_days: 7
  currency: USD
  timezone: Asia/Kolkata      # calls are counted on the day they were made, in this zone
  prices:                     # per 1,000,000 tokens, from the provider's price sheet for the deployment's region
    gpt-5.4-nano: {input: null, cached_input: null, output: null}
    gpt-4.1-mini: {input: null, cached_input: null, output: null}

# Sessions (F-03.3).
sessions:
  idle_minutes: 480
  absolute_hours: 12

# The document-processing sidecar (AD-2).
services:
  ingest_url: "http://127.0.0.1:3102"
  # Files of one upload read at once, one per request to the document service; each is stored the moment it
  # is read. OCR on the service side is limited separately (INGEST_OCR_WORKERS, default 2).
  ingest_workers: 4
  copilot_url: "http://127.0.0.1:8020"   # the case assistant (CREDITIQ_COPILOT_URL overrides it)

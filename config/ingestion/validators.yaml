# Cross-field and table validators (FRD F-15, F-17). A validator reports; it never edits a value.
# Field-level format checks are named in fields.yaml (`validators: [format:pan]`).
rules:
  - id: required_present
    types: [certificate_of_incorporation, memorandum_articles_of_association, company_pan, director_kyc, board_resolution_borrowing, audited_financial_statements, income_tax_return, gstr_3b, gstr_1, bank_statement, existing_facilities_declaration, sanction_letter, commercial_bureau_report]
    kind: required
    severity: fail
    label: Required fields present

  - id: cin_year_matches_incorporation
    types: [certificate_of_incorporation]
    kind: cin_year_matches_date
    params: {cin: cin, date: date_of_incorporation}
    severity: warn
    label: CIN year matches date of incorporation

  - id: pan_is_company
    types: [company_pan]
    kind: pan_entity_char
    params: {pan: pan, expect: C}
    severity: warn
    label: PAN belongs to a company

  - id: period_in_order
    types: [bank_statement]
    kind: date_order
    params: {first: statement_period_start, second: statement_period_end}
    severity: fail
    label: Statement period start is before end

  - id: running_balance
    types: [bank_statement]
    kind: balance_continuity
    params: {table: transactions, date: date, debit: debit, credit: credit, balance: balance, opening: opening_balance, closing: closing_balance}
    severity: fail
    label: Running balance continuous and closing balance agrees

  - id: balance_sheet_balances
    types: [audited_financial_statements]
    kind: rows_equal
    params: {table: balance_sheet, label_column: particulars, pattern: '^(?:TOTAL|Total (?:Equity (?:&|and) Liabilities|Assets))$', column: current_period, compare: [0, 1]}
    severity: fail
    label: Balance sheet totals agree

  - id: balance_sheet_balances_previous
    types: [audited_financial_statements]
    kind: rows_equal
    params: {table: balance_sheet, label_column: particulars, pattern: '^(?:TOTAL|Total (?:Equity (?:&|and) Liabilities|Assets))$', column: previous_period, compare: [0, 1]}
    severity: fail
    label: Balance sheet totals agree (previous year)

  - id: signature_block_filled
    types: [board_resolution_borrowing]
    kind: blank_after_label
    params: {labels: ['Signature:', 'Name:']}
    severity: warn
    label: Signature block completed
    defect: unsigned

  - id: stamp_block_filled
    types: [board_resolution_borrowing]
    kind: blank_after_label
    params: {labels: ['Stamp:', 'Seal:', 'Company seal:']}
    severity: warn
    label: Company stamp present
    defect: unstamped

  - id: declaration_signed
    types: [existing_facilities_declaration, sanction_letter]
    kind: blank_after_label
    params: {labels: ['Signature:', 'Authorised signatory:', 'Name:']}
    severity: warn
    label: Signature block completed
    defect: unsigned

  - id: sanction_on_letterhead
    types: [sanction_letter]
    kind: letterhead
    params: {pattern: '\b(bank|finance|financial|capital|nbfc|limited|ltd)\b', lines: 3, ignore: '^\s*(borrower|to|name of|dear|m/s)\b'}
    severity: warn
    label: Issued on the lender's letterhead
    defect: plain_paper

  - id: itr_assessment_year_form
    types: [income_tax_return]
    kind: field_pattern
    params: {field: assessment_year, pattern: '20\d{2}-\d{2}'}
    severity: fail
    label: Assessment year is written as 2024-25

  - id: itr_financial_year_form
    types: [income_tax_return]
    kind: field_pattern
    params: {field: financial_year, pattern: '(?:FY\s*)?20\d{2}(?:-\d{2})?'}
    severity: fail
    label: Financial year is written as 2023-24 or FY2024

  - id: itr_years_consecutive
    types: [income_tax_return]
    kind: year_pair
    params: {financial_year: financial_year, assessment_year: assessment_year}
    severity: fail
    label: Assessment year follows the financial year

  - id: itr_gross_not_below_total
    types: [income_tax_return]
    kind: amount_order
    params: {larger: gross_total_income, smaller: total_income}
    severity: fail
    label: Total income does not exceed gross total income

  - id: itr_amounts_not_negative
    types: [income_tax_return]
    kind: non_negative
    params: {fields: [gross_total_income, total_income, tax_payable, tax_paid, refund_amount]}
    severity: fail
    label: No amount is negative

  - id: itr_tax_reconciles
    types: [income_tax_return]
    kind: tax_reconciles
    params: {paid: tax_paid, liability: tax_payable, refund: refund_amount, tolerance: 10}
    severity: fail
    label: Taxes paid, liability and refund agree

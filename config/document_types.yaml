# The closed list of document types (docs/functional-requirements.md F-00.4, F-09; AD-2a).
# Classification chooses only from this list, or none_of_these. What each type contains
# (fields, tables), how it is recognised (signals) and how it is read are in config/ingestion/,
# published in the same version; the ids here must match config/ingestion/document_types.json.
# `satisfies`: checklist item ids (config/checklist_taxonomy.yaml).
# application_message is the RM's sourcing message, stored with the case (F-04); the
# document-processing service does not read it.

types:
  - id: application_message
    name: Sourcing message
    group: origination
    description: The RM's sourcing email, WhatsApp message or notes, pasted when the application was created.

  - id: certificate_of_incorporation
    name: Certificate of incorporation
    group: constitution
    description: Registrar of Companies certificate that a company is incorporated, with its CIN.
    satisfies: [coi]

  - id: memorandum_articles_of_association
    name: Memorandum and articles of association
    group: constitution
    description: The company's memorandum and articles of association, including its objects, capital and borrowing powers.
    satisfies: [moa_aoa]
    party_list: {field: directors, name_key: name, din_key: din, role: director}

  - id: board_resolution_borrowing
    name: Board resolution for borrowing
    group: constitution
    description: Certified extract of a board resolution authorising the borrowing and the signatories.
    satisfies: [board_resolution]
    party_list: {field: authorized_persons, role: director}

  - id: company_pan
    name: Company PAN
    group: registration
    description: Income Tax Department intimation of the company's permanent account number.
    satisfies: [pan_entity]

  - id: director_kyc
    name: Director KYC
    group: kyc
    description: A director's or promoter's identity details and identity document.
    satisfies: [kyc_promoters]
    instance_key: person
    personal: true

  - id: audited_financial_statements
    name: Audited financial statements
    group: financials
    description: Audited balance sheet, statement of profit and loss and cash flow statement for a financial year.
    satisfies: [fs_fy_minus2, fs_fy_minus1]
    instance_key: year

  - id: income_tax_return
    name: Income tax return
    group: tax
    description: Income tax return acknowledgement with the computation of total income, for an assessment year.
    satisfies: [itr]
    instance_key: year

  - id: gstr_3b
    name: GSTR-3B
    group: tax
    description: Monthly GST summary return (GSTR-3B), one per tax period.
    satisfies: [gst_returns]
    instance_key: period

  - id: bank_statement
    name: Bank statement
    group: banking
    description: Statement of a current or cash credit account, with its transactions and balances.
    satisfies: [bank_statements]
    instance_key: account

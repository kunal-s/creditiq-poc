# Role catalogue and the sign-in directory for the PoC
# (docs/functional-requirements.md §4, F-03). Names are fictional and were
# checked against the private excluded-terms list (CLAUDE.md rule 3).
#
# Authored config, not the published policy/checklist store: nothing here
# changes without a new commit. Configuration publishing is done by an
# Administrator from the command line, so there is no admin role in the UI.

roles:
  - id: rm
    label: Relationship Manager
  - id: analyst
    label: Credit Analyst
  - id: credit-manager
    label: Credit Manager

# Nav groups each role may see (src/components/shell/nav.ts). Anything not
# listed here is not rendered for that role; within a group, each item is
# also gated by its permission. A case's tabs are gated by permission only.
navByRole:
  rm: [workbench]
  analyst: [workbench, governance]
  credit-manager: [workbench, governance]

# What each role may do (F-03.1). The server denies anything not listed.
# case.read.all: see every case (an RM sees only cases they created).
# case.delete: delete a case and everything it owns (F-01.5; an RM only their own).
permissions:
  rm: [case.create, case.read, case.delete, document.upload, checklist.read, query.read]
  analyst: [case.create, case.read, case.read.all, case.delete, document.upload, checklist.read, query.read,
            data.read, review.read, review.decide, finding.read, output.read, manual.make]
  credit-manager: [case.read, case.read.all, case.delete, checklist.read, query.read, data.read, review.read,
                   review.decide, finding.read, output.read, manual.check, comparison.adjudicate,
                   scorecard.read]

# Every user signs in with this shared password until F-03 introduces named
# credentials. Hash format: pbkdf2_sha256$<iterations>$<base64 salt>$<base64 digest>.
auth:
  demoPassword: "CreditIQ-2026!"

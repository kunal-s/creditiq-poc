types:
  # Identity
  certificate_of_incorporation: {parts: [incorporation_certificate]}
  memorandum_articles_of_association: {parts: [memorandum, articles]}
  company_pan: {parts: [pan_letter]}
  director_kyc: {parts: [kyc_person]}
  board_resolution_borrowing: {parts: [board_resolution]}
  partnership_deed: {parts: [partnership_deed]}
  udyam_registration: {parts: [udyam_certificate]}

  # Financials: three types share the statement parts; their own words decide over the run.
  audited_financial_statements:
    default: true            # statements that do not say provisional or projected are taken as audited
    parts: [statements_cover, auditor_report, balance_sheet, profit_and_loss, cash_flow, notes]
    title:
      - audited financial statements
      - audited accounts
      - independent auditor's report
    content:
      - {phrase: we have audited, weight: 2}
      - {phrase: independent auditor, weight: 2}
      - {phrase: udin, weight: 1}
      - {phrase: basis for opinion, weight: 2}
    warning:
      - {phrase: provisional, zone: title}
      - {phrase: unaudited, zone: title}
      - {phrase: projected, zone: title}
      - {phrase: estimated, zone: title}
      - {phrase: unaudited, weight: 1}     # in the body only lowers the score: notes may mention unaudited quarterly results
  provisional_financial_statements:
    parts: [statements_cover, accountant_certificate, balance_sheet, profit_and_loss, cash_flow, notes]
    title:
      - provisional financial statements
      - provisional balance sheet
      - provisional accounts
      - unaudited financial statements
    content:
      - {phrase: provisional, weight: 3}
      - {phrase: unaudited, weight: 2}
      - {phrase: we have compiled, weight: 2}
      - nine months ended
      - six months ended
      - half year ended
      - for the period ended
    warning:
      - {phrase: independent auditor's report, zone: title}
      - {phrase: projected, zone: title}
  projected_financial_statements:
    unverified: true
    parts: [statements_cover, projection_assumptions, balance_sheet, profit_and_loss, cash_flow]
    title:
      - projected financial statements
      - projected balance sheet
      - projected profit and loss
      - financial projections
      - estimated and projected
    content:
      - {phrase: projected, weight: 3}
      - {phrase: estimated, weight: 1}
      - {phrase: projections, weight: 2}
    warning:
      - {phrase: independent auditor's report, zone: title}
      - {phrase: credit monitoring arrangement, zone: title}
  cma_data:
    unverified: true
    parts: [cma_forms]
  income_tax_return:
    parts: [itr_acknowledgement_page, itr_computation, itr_form]
    needs_part: [itr_computation, itr_form]
  itr_acknowledgement:
    parts: [itr_acknowledgement_page]
  form_26as:
    unverified: true
    parts: [tax_credit_statement]
  gstr_3b: {parts: [gstr3b_return]}
  gstr_1: {parts: [gstr1_return]}
  gstr_9:
    unverified: true
    parts: [gstr9_return]

  # Banking
  bank_statement: {parts: [transactions]}
  stock_statement: {parts: [stock_statement]}
  existing_facilities_declaration: {parts: [facilities_declaration]}
  sanction_letter: {parts: [sanction_letter]}
  commercial_bureau_report: {parts: [bureau_report]}

# Case B: the clean case (plan.md section 6 "Case B triangulates by
# construction"). Partnership, Ludhiana. Cash-credit-only request sized at
# or below the turnover-method threshold (FR-3), so no MPBF question arises
# here — that is exercised by Case A instead (departure 1). Takeover of an
# existing cash credit from a fictional bank. Carries zero planted findings.
#
# Precision traps the ledger/document generator must still produce, and
# which the reference evaluator must confirm all normalise to a pass (not
# modelled as `plants`, since a plant is a finding and Case B has none):
# a declared-lender EMI; an own-account sweep sized above 1.5x the turnover
# tolerance; one loan disbursal credit; one reversed NEFT; one outward
# cheque return; truncated customer-name variants in the bank narration;
# GST-inclusive (gross) bank credits compared against GST taxable value plus
# tax, not against net book turnover.
#
# Identifiers are pinned literals, checksum-valid where a checksum exists
# (GSTIN). Existence against MCA/GST/Udyam/RBI/ICAI is the human
# verification step (plan.md C11) — not yet done; see HANDOFF.md.

# The closed list of document types (docs/functional-requirements.md F-00.4, F-09; AD-2a).
# Classification chooses only from this list, or none_of_these. What each type contains
# (fields, tables), how it is recognised (signals) and how it is read are in config/ingestion/,
# published in the same version; the ids here must match config/ingestion/document_types.json.
# `satisfies`: checklist item ids (config/checklist_taxonomy.yaml).
# `provenance`: where the document comes from, as the cross-verification board tags it:
# declared (the RM's message, the borrower's own declaration), borrower_supplied (documents the
# borrower hands over) or independent (the bureau, RBL's GST and bank-statement analysis partners).
# application_message is the RM's sourcing message, stored with the case (F-04); the
# document-processing service does not read it.

types:
  - id: application_message
    name: Sourcing message
    group: origination
    provenance: declared
    description: The RM's sourcing email, WhatsApp message or notes, pasted when the application was created.

  - id: certificate_of_incorporation
    name: Certificate of incorporation
    group: constitution
    provenance: borrower_supplied
    description: Registrar of Companies certificate that a company is incorporated, with its CIN.
    satisfies: [coi]

  - id: memorandum_articles_of_association
    name: Memorandum and articles of association
    group: constitution
    provenance: borrower_supplied
    description: The company's memorandum and articles of association, including its objects, capital and borrowing powers.
    satisfies: [moa_aoa]
    party_list: {field: directors, name_key: name, din_key: din, role: director}

  - id: board_resolution_borrowing
    name: Board resolution for borrowing
    group: constitution
    provenance: borrower_supplied
    description: Certified extract of a board resolution authorising the borrowing and the signatories.
    satisfies: [board_resolution]
    party_list: {field: authorized_persons, din_field: authorized_person_dins, role: director}

  - id: company_pan
    name: Company PAN
    group: registration
    provenance: borrower_supplied
    description: Income Tax Department intimation of the company's permanent account number.
    satisfies: [pan_entity]

  - id: director_kyc
    name: Director KYC
    group: kyc
    provenance: borrower_supplied
    description: A director's or promoter's identity details and identity document.
    satisfies: [kyc_promoters]
    instance_key: person
    personal: true

  - id: audited_financial_statements
    name: Audited financial statements
    group: financials
    provenance: borrower_supplied
    description: Audited balance sheet, statement of profit and loss and cash flow statement for a financial year.
    satisfies: [fs_fy_minus3, fs_fy_minus2, fs_fy_minus1]
    instance_key: year

  - id: income_tax_return
    name: Income tax return
    group: tax
    provenance: borrower_supplied
    description: Income tax return acknowledgement with the computation of total income, for an assessment year.
    satisfies: [itr]
    instance_key: year

  - id: gstr_3b
    name: GSTR-3B
    group: tax
    provenance: borrower_supplied
    description: Monthly GST summary return (GSTR-3B), one per tax period.
    satisfies: [gst_returns]
    instance_key: period

  # The seller's own statement of outward supplies. On no checklist item: GSTR-3B is what the
  # gst_returns item asks for; GSTR-1 is what the turnover cross-checks read the sales from.
  - id: gstr_1
    name: GSTR-1
    group: tax
    provenance: borrower_supplied
    description: Statement of outward supplies (GSTR-1), one per tax period.
    instance_key: period

  - id: bank_statement
    name: Bank statement
    group: banking
    provenance: borrower_supplied
    description: Statement of a current or cash credit account, with its transactions and balances.
    satisfies: [bank_statements]
    instance_key: account

  # Existing facilities and the bureau (TC-20, TC-23; docs/cross-verification-plan.md). On no
  # checklist item: what is declared, sanctioned and reported is reconciled by the cross-checks
  # (OB-01, OB-02, BA-01, BA-02), and the bureau report is obtained by the bank, not asked of
  # the customer.
  - id: existing_facilities_declaration
    name: Declaration of existing facilities
    group: banking
    provenance: declared
    description: The borrower's declaration of its existing credit facilities and bank accounts, or that it has none.

  - id: sanction_letter
    name: Sanction letter
    group: banking
    provenance: borrower_supplied
    description: A lender's letter sanctioning a credit facility to the borrower, with the amount and terms.

  - id: commercial_bureau_report
    name: Commercial bureau report
    group: bureau
    provenance: independent
    description: A credit information company's report on the borrower, with its credit facilities, credit rank and related parties.
    partner_output: true
    party_list: {field: related_parties, name_key: name, pan_key: pan, designation_key: relationship, role: director}

  # Types added for the restructure (decision 14). They satisfy no checklist item until one is mapped.
  - id: provisional_financial_statements
    name: Provisional financial statements
    group: financials
    provenance: borrower_supplied
    description: Unaudited or provisional balance sheet and statement of profit and loss for a part or whole year, often certified by a chartered accountant.
    instance_key: period

  - id: projected_financial_statements
    name: Projected financial statements
    group: financials
    provenance: borrower_supplied
    description: Estimated and projected balance sheet and statement of profit and loss for coming years.

  - id: cma_data
    name: CMA data
    group: working_capital
    provenance: borrower_supplied
    description: Credit monitoring arrangement data, with the operating statement, balance sheet analysis, current assets and liabilities, and the maximum permissible bank finance, for past, estimated and projected years.

  - id: stock_statement
    name: Stock statement
    group: working_capital
    provenance: borrower_supplied
    description: The borrower's statement of stock and book debts as at a date, submitted to a lender for drawing power.
    instance_key: period

  - id: gstr_9
    name: GSTR-9
    group: tax
    provenance: borrower_supplied
    description: Annual GST return (GSTR-9) for a financial year.
    instance_key: year

  - id: form_26as
    name: Form 26AS
    group: tax
    provenance: independent
    description: Annual tax statement of tax deducted and paid against a PAN, for an assessment year.
    instance_key: year

  - id: itr_acknowledgement
    name: ITR acknowledgement
    group: tax
    provenance: borrower_supplied
    description: Acknowledgement of an income tax return filed, for an assessment year.
    instance_key: year

  - id: partnership_deed
    name: Partnership deed
    group: constitution
    provenance: borrower_supplied
    description: The deed constituting a partnership firm, with its partners, their shares and capital.
    party_list: {field: partners, name_key: name, role: partner}

  - id: udyam_registration
    name: Udyam registration certificate
    group: registration
    provenance: independent
    description: Certificate of registration of a micro, small or medium enterprise, with its Udyam number and classification.

# How serious a cross-check finding is (F-19.1).
severity:
  serious: Serious
  moderate: Moderate
  mild: Mild

# Shared by the aligned facts (F-18) and the policy norms (F-20).
crossCheck:
  morePages: "+{n} more"
  manual: Relies on a person's entry

# The cross-verification board (F-19; the Cross-checks tab): an overview card per area checked,
# then a section per area with its discrepancies ranked by credit impact, each with its sources
# side by side, the gap on each leg and a decision; what could not be checked, what passed, and
# the facts the checks compared.
crossVerification:
  kicker: "Appraisal {id} · Cross-verification"
  summary:
    none: Every source lined up against every other. No discrepancy found for this borrower.
    one: Every source lined up against every other. One discrepancy found for this borrower, with its evidence attached and a decision required from you.
    many: "Every source lined up against every other. {n} discrepancies found for this borrower, ranked by credit impact, each with its evidence attached and a decision required from you."
    decidedOne: Every source lined up against every other. One discrepancy found for this borrower, decided and recorded.
    decidedMany: "Every source lined up against every other. {n} discrepancies found for this borrower, each decided and recorded."
    notRun: No checks have run yet for this borrower.
  meta:
    adjudicated: "{adjudicated} of {total} adjudicated"
    run: "{id} · {rules} rules across {sources} sources · {at}"
  # Keyed by the area the engine sends. The board shows the areas the enabled rules cover
  # (identity, turnover, bank accounts, existing obligations); the others are worded for the day
  # their rules are switched back on in configuration.
  area:
    identity:
      title: Identity consistency
      purpose: PAN, GSTIN, CIN, name and directors agree across every document.
    turnover:
      title: Turnover
      purpose: Audited, GST, banked and declared turnover agree within tolerance.
    accounts:
      title: Bank accounts
      purpose: Every declared account has a statement; every account on file was declared.
    obligations:
      title: Existing obligations
      purpose: Declared facilities agree with sanction letters, the bureau and the bank.
    authority:
      title: Borrowing authority
      purpose: The board resolution covers the borrowing, from this bank, by its directors.
    tax:
      title: Income tax
      purpose: Each audited year has its income tax return, and its profit agrees with the books.
    financials:
      title: Financial statements
      purpose: Each year's statements agree with the previous audit and the bank balances.
  overview:
    label: The areas checked
  status:
    open: Open discrepancies
    decided: Every discrepancy decided
    incomplete: Some checks could not run
    clear: Everything checked agrees
  areaCard:
    openOne: open discrepancy
    openMany: open discrepancies
    blocking: Blocking
    decided: "{adjudicated} of {total} decided"
    noDiscrepancy: No discrepancy
    allDecided: Every discrepancy decided
    keyFigures: Key figures
  # The severity tiles at the head of the board: the open discrepancies by credit impact, and
  # how many of all of them have been decided. Ranked by impact, not by the area they fall in.
  tiles:
    serious: Serious
    moderate: Moderate
    mild: Mild
    adjudicated: Adjudicated
    outOf: "of {total}"
    blocking: Blocking
    noneSerious: No serious discrepancy
    noneModerate: No moderate discrepancy
    noneMild: No mild discrepancy
    allDecided: Every discrepancy decided
    noneToDecide: Nothing to decide
  count:
    serious: "{n} serious"
    moderate: "{n} moderate"
    mild: "{n} mild"
    ruleOne: 1 rule
    ruleMany: "{n} rules"
    discrepancyOne: 1 discrepancy
    discrepancyMany: "{n} discrepancies"
    incomplete: "{n} could not be checked"
    passed: "{n} passed"
    notApplicable: "{n} not applicable"
  section:
    none: No discrepancy in this area.
  emptyTitle: No checks yet
  emptyDescription: The cross-checks run once documents have been read and their values extracted.
  header:
    spread: Spread
    queue: Exception queue
    continue: Continue to draft
    continueBlocked: Submission is blocked until every blocking discrepancy is accepted or dismissed.
  banner:
    seriousOne: Submission blocked — 1 serious discrepancy unadjudicated
    seriousMany: "Submission blocked — {n} serious discrepancies unadjudicated"

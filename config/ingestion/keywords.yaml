      - {phrase: registrar of companies, weight: 2}
      - {phrase: corporate identity number, weight: 2}
      - {identifier: cin, weight: 1}
      - central registration centre
      - ministry of corporate affairs
      - companies act
      - {phrase: is incorporated, weight: 2}
      - company limited by shares
      - given under my hand
  memorandum:
    title:
      - memorandum of association
      - memorandum and articles of association
    content:
      - {phrase: name clause, weight: 2}
      - {phrase: objects clause, weight: 2}
      - {phrase: liability clause, weight: 2}
      - {phrase: capital clause, weight: 2}
      - subscription clause
      - authorised share capital
      - divided into equity shares
      - the liability of the members is limited
      - subscribers
  articles:
    title:
      - articles of association
    content:
      - {phrase: interpretation, weight: 1}
      - share capital and variation of rights
      - borrowing powers
      - board of directors
      - general meetings

      - {identifier: ifsc, weight: 1}
      - value date
      - {phrase: narration, weight: 1}
      - particulars
      - {phrase: withdrawal, weight: 1}
      - deposit
      - {phrase: debit, weight: 0.5}
      - {phrase: credit, weight: 0.5}
      - {phrase: balance, weight: 0.5}
      - cheque
      # What every bank prints in its narrations; short words match only exactly. A page of rows with no headings
      # (a statement's later pages) is placed by these, and by the table continuing from the page before (Epic 3).

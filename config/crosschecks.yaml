# Cross-check rules (docs/functional-requirements.md F-19; docs/cross-verification-plan.md).
# Each rule names the fact it compares (`variable`, computed by engine/facts.py
# and evaluated by engine/crosschecks.py), what it compares in words (`title`),
# the finding in plain English when it fails (`finding_title`), the credit
# policy clause it enforces when RBL supplies one (`policy_ref`), the area it is shown under, the
# document types that supply it, how the sources are compared, the tolerance
# it uses (config/tolerances.yaml), its severity and whether it blocks
# submission (`blocking`: the memo cannot be drafted while such a discrepancy is
# not accepted or dismissed). Sources are the document types (config/document_types.yaml) and the
# case record (`application_message`, the RM's sourcing message).
#
# Areas: identity, authority, turnover, tax, financials, accounts, obligations.
#
# `enabled: false` switches a rule off: it stays here, and is still validated, but is not
# run, so it gives no finding, review item, query, CAM or PD-note entry, and blocks nothing.
# Delete the line (or set it to true) and publish to switch the rule back on. On 11 October
# 2026 the board-resolution, income-tax and financial-statement rules (BR-01 to BR-04, TX-01,
# TX-02, FS-01, FS-02) were switched off, so the cross-verification board covers the test
# plan's four areas: identity, turnover, bank accounts and existing obligations. On 12 October
# 2026 the income-tax rules came back, in the turnover area with the tax return's turnover
# (TX-03 to TX-05), so the board keeps its four areas.
#
# Comparisons (F-19.1, plus bound and order):
#   exact         every source gives the same value
#   tolerance     every pair of sources within the tolerance, as a percentage
#   set_equal     every source gives the same set
#   set_contains  every member of the first side appears in the second
#   presence      the fact exists at all
#   bound         one value at least (or at most) another
#   order         dates in sequence
#
# Templates may use {left}, {right}, {left_label}, {right_label}, {period},
# {variance}, {tolerance}, {items}, {lenders} and {accounts}. `query` is the plain request
# added to the pre-login query list when the rule fails (F-19.5);
# `pd_question` is what to ask the promoter in the personal discussion
# (F-24.1) and may also use {explanation}.

# The personal-discussion question for a check that could not be completed.
pd_incomplete: "{title}: {explanation} Can the missing figures be provided before sanction?"

rules:
  # --- Identity (TC-22) ---
  - id: ID-01
    title: Entity PAN consistent across documents
    finding_title: Entity PAN differs between documents
    area: identity
    variable: entity_pan
    sources: [company_pan, income_tax_return, gstr_3b, commercial_bureau_report, existing_facilities_declaration]
    comparison: exact
    severity: serious
    blocking: true
    explanation: "The entity PAN differs between documents: {items}."
    query: "Please confirm the entity's PAN; the documents show {items}."
    pd_question: "{explanation} Which PAN is the entity's, and why does the other document show a different one?"

  - id: ID-02
    title: GSTIN consistent across documents
    finding_title: GSTIN differs between documents
    area: identity
    variable: gstin
    sources: [gstr_3b, commercial_bureau_report, existing_facilities_declaration]
    comparison: exact
    severity: serious
    blocking: true
    explanation: "The GSTIN differs between documents: {items}."
    query: "Please confirm the GSTIN; the documents show {items}."
    pd_question: "{explanation} Which GSTIN is current, and are there other registrations?"

  - id: ID-03
    title: Legal name consistent across documents
    finding_title: Company name differs between documents
    area: identity
    variable: legal_name
    sources: [certificate_of_incorporation, memorandum_articles_of_association, board_resolution_borrowing, company_pan, income_tax_return, gstr_3b, audited_financial_statements, bank_statement, commercial_bureau_report, existing_facilities_declaration, sanction_letter]
    comparison: exact
    tolerance: name_match
    severity: moderate
    blocking: false
    explanation: "The legal name reads differently across documents: {items}."
    pd_question: "{explanation} Has the entity changed its name, or is any document for another entity?"

  - id: ID-04
    title: Promoters match the KYC received
    finding_title: Promoter missing from a source
    area: identity
    variable: promoter_set
    sources: [director_kyc, application_message, commercial_bureau_report]
    comparison: set_equal
    tolerance: name_match
    severity: serious
    blocking: true
    explanation: "The promoters named differ between sources: {items}."
    query: "Please confirm the full list of directors, partners or the proprietor; {items}."
    pd_question: "{explanation} Who are the directors, partners or proprietor today, and has anyone joined or left?"

  - id: ID-05
    title: CIN consistent across documents
    finding_title: CIN differs between documents
    area: identity
    variable: cin
    sources: [certificate_of_incorporation, memorandum_articles_of_association, commercial_bureau_report, existing_facilities_declaration]
    comparison: exact
    severity: serious
    blocking: true
    explanation: "The CIN differs between documents: {items}."
    query: "Please confirm the company's CIN; the documents show {items}."
    pd_question: "{explanation} Which CIN is the company's?"

  - id: ID-06
    title: Director identifiers agree
    finding_title: Director identifiers disagree
    area: identity
    variable: director_identifiers
    sources: [director_kyc, memorandum_articles_of_association]
    comparison: exact
    severity: moderate
    blocking: false
    explanation: "Director identifiers disagree: {items}."
    query: "Please confirm the directors' DIN and PAN; {items}."
    pd_question: "{explanation} Is each KYC for the director it is filed for?"

  - id: ID-07
    title: CIN agrees with the incorporation particulars
    finding_title: CIN does not match the incorporation details
    area: identity
    variable: incorporation_particulars
    sources: [certificate_of_incorporation]
    comparison: exact
    severity: mild
    blocking: false
    explanation: "The CIN does not agree with the particulars on file: {items}."
    pd_question: "{explanation} Has the company's class or status changed since incorporation?"

  - id: ID-08
    title: Directors in the memorandum are accounted for
    finding_title: Director in the memorandum not accounted for
    area: identity
    variable: memorandum_directors
    sources: [memorandum_articles_of_association, director_kyc, application_message]
    comparison: set_contains
    tolerance: name_match
    severity: mild
    blocking: false
    explanation: "{items} named as director(s) in the memorandum, but no KYC was received and the sourcing message does not name them."
    query: "Please confirm whether {items} is still a director, and provide KYC if so."
    pd_question: "{explanation} Is {items} still on the board?"


  # Names of people in full: inside the match the other checks make, each person's first, middle
  # and last name across the documents (the RM's message is left out: it often shortens names).
  - id: ID-09
    title: Names of people agree in full across documents
    finding_title: A person's name differs in part between documents
    area: identity
    variable: person_names
    sources: [director_kyc, memorandum_articles_of_association, commercial_bureau_report]
    comparison: exact
    tolerance: name_match
    severity: mild
    blocking: false
    explanation: "Names differ in part: {items}."
    query: "Please confirm each person's full name as on their PAN, as the documents differ: {items}."
    pd_question: "{explanation} What is each person's full name as on their PAN?"

  # --- Borrowing authority: the board resolution (switched off) ---
  - id: BR-01
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Board resolution covers the amount requested
    finding_title: Board resolution does not cover the amount requested
    area: authority
    variable: borrowing_limit
    sources: [board_resolution_borrowing]
    comparison: bound
    severity: serious
    blocking: true
    explanation: "The board resolution authorises borrowing up to {left}; the amount requested is {right}."
    query: "Please provide a board resolution authorising borrowing of {right}."
    pd_question: "{explanation} Will the board pass a resolution for the full amount?"

  - id: BR-02
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Authorised signatories are directors
    finding_title: Authorised signatory is not a director
    area: authority
    variable: signatories_are_directors
    sources: [board_resolution_borrowing, director_kyc, memorandum_articles_of_association, application_message]
    comparison: set_contains
    tolerance: name_match
    severity: moderate
    blocking: false
    explanation: "{items} is authorised to sign in the board resolution but is not among the directors on file."
    query: "Please confirm the position of {items} in the company, and provide KYC."
    pd_question: "{explanation} What is their role in the company?"

  - id: BR-03
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Board resolution is in favour of this bank
    finding_title: Board resolution is not in favour of this bank
    area: authority
    variable: resolution_lender
    sources: [board_resolution_borrowing]
    comparison: exact
    tolerance: name_match
    severity: moderate
    blocking: false
    explanation: "The board resolution authorises borrowing from {left}, not from this bank."
    query: "Please provide a board resolution authorising borrowing from this bank."

  - id: BR-04
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Board resolution is correctly dated
    finding_title: Board resolution is wrongly dated
    area: authority
    variable: resolution_date
    sources: [board_resolution_borrowing, certificate_of_incorporation]
    comparison: order
    severity: mild
    blocking: false
    explanation: "The board resolution is {items}."
    query: "Please provide a correctly dated board resolution."

  # --- Turnover (TC-23), per financial year ---
  - id: TO-01
    title: Audited turnover against GST outward supplies
    finding_title: Audited turnover differs from GST returns
    area: turnover
    variable: turnover_audited_vs_gst
    sources: [audited_financial_statements, gstr_3b]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against {right_label} {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between audited turnover ({left}) and GST outward supplies ({right}) for {period}."
    pd_question: "{explanation} What explains the difference between the audited turnover and GST returns?"

  - id: TO-02
    title: GST outward supplies against cleansed bank credits
    finding_title: GST turnover not supported by bank credits
    area: turnover
    variable: turnover_gst_vs_bank
    sources: [gstr_3b, bank_statement]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against {right_label} {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between GST outward supplies ({left}) and business credits in the bank statements ({right}) for {period}."
    pd_question: "{explanation} Are sales received in accounts not shown to us, or in cash?"

  - id: TO-03
    title: Audited turnover against cleansed bank credits
    finding_title: Audited turnover not supported by bank credits
    area: turnover
    variable: turnover_audited_vs_bank
    sources: [audited_financial_statements, bank_statement]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against {right_label} {right}, a variance of {variance} (tolerance {tolerance})."
    pd_question: "{explanation} Where are the remaining sales receipts banked?"

  - id: TO-04
    title: RM-declared turnover against evidenced turnover
    finding_title: Declared turnover differs from the evidence
    area: turnover
    variable: turnover_declared_vs_evidenced
    sources: [application_message, audited_financial_statements]
    comparison: tolerance
    tolerance: declared_turnover_variance
    severity: mild
    blocking: false
    explanation: "{left_label} {left} against {right_label} {right} for {period}, a variance of {variance} (tolerance {tolerance})."
    pd_question: "{explanation} What turnover figure should be relied on, and why does it differ from the statements?"

  - id: TO-05
    title: GST outward supplies against bank credits, months both cover
    finding_title: GST and bank credits diverge over the months both cover
    area: turnover
    variable: turnover_gst_vs_bank_window
    sources: [gstr_3b, bank_statement]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: GST outward supplies {left} against business credits {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between GST outward supplies ({left}) and business credits in the bank statements ({right}) for {period}."
    pd_question: "{explanation} Are sales received in accounts not shown to us, or in cash?"

  # --- Tax: the income tax return against the books and the other turnover sources (shown under turnover) ---
  - id: TX-01
    title: Each audited year has its income tax return
    finding_title: Income tax return missing for an audited year
    area: turnover
    variable: itr_years
    sources: [audited_financial_statements, income_tax_return]
    comparison: set_contains
    severity: mild
    blocking: false
    explanation: "No income tax return is on file for {items}, though it is due."
    query: "Please provide the income tax return, with computation and acknowledgement, for {items}."

  - id: TX-02
    title: Profit in the income tax return agrees with the books
    finding_title: Profit in the tax return differs from the books
    area: turnover
    variable: itr_profit
    sources: [audited_financial_statements, income_tax_return]
    comparison: tolerance
    tolerance: profit_variance
    severity: moderate
    blocking: false
    explanation: "{period}: profit before tax of {left} in the audited statements against {right} in the income tax return, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between the book profit ({left}) and the profit in the income tax return ({right}) for {period}."
    pd_question: "{explanation} Which adjustments explain the difference?"

  # The turnover the return shows, for the year it covers, against each other source. A return
  # that shows no turnover leaves nothing to compare (not applicable).
  - id: TX-03
    title: Turnover in the income tax return against audited revenue
    finding_title: Turnover in the tax return differs from the audited revenue
    area: turnover
    variable: turnover_itr_vs_audited
    sources: [income_tax_return, audited_financial_statements]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against the audited revenue {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between the turnover in the income tax return ({left}) and the audited revenue ({right}) for {period}."
    pd_question: "{explanation} Which figure was filed with the tax department, and why do they differ?"

  - id: TX-04
    title: Turnover in the income tax return against GST outward supplies
    finding_title: Turnover in the tax return differs from GST returns
    area: turnover
    variable: turnover_itr_vs_gst
    sources: [income_tax_return, gstr_3b]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against GST outward supplies {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between the turnover in the income tax return ({left}) and GST outward supplies ({right}) for {period}."
    pd_question: "{explanation} Were any sales outside GST, or reported in a different period?"

  - id: TX-05
    title: Turnover in the income tax return against cleansed bank credits
    finding_title: Turnover in the tax return not supported by bank credits
    area: turnover
    variable: turnover_itr_vs_bank
    sources: [income_tax_return, bank_statement]
    comparison: tolerance
    tolerance: turnover_variance
    severity: moderate
    blocking: false
    explanation: "{period}: {left_label} {left} against business credits {right}, a variance of {variance} (tolerance {tolerance})."
    query: "Please explain the difference between the turnover in the income tax return ({left}) and business credits in the bank statements ({right}) for {period}."
    pd_question: "{explanation} Are sales received in accounts not shown to us, or in cash?"

  # --- Audited statements against each other and the bank (switched off) ---
  - id: FS-01
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Previous-year figures agree with that year's audited statements
    finding_title: Previous-year figures restated
    area: financials
    variable: comparatives
    sources: [audited_financial_statements]
    comparison: tolerance
    tolerance: comparatives_variance
    severity: moderate
    blocking: false
    explanation: "The {period} figures shown in the later statements differ from the {period} audited statements: {items}."
    query: "Please confirm whether the {period} accounts were restated, and why."
    pd_question: "{explanation} Were the accounts restated, and why?"

  - id: FS-02
    enabled: false  # switched off on 11 October 2026 (see the note above)
    title: Year-end bank balances within the audited cash and bank balance
    finding_title: Year-end bank balances exceed the audited balance
    area: financials
    variable: year_end_balance
    sources: [audited_financial_statements, bank_statement]
    comparison: bound
    tolerance: balance_variance
    severity: mild
    blocking: false
    explanation: "Bank balances on {period} total {left}, more than the audited cash and bank balance of {right}."
    pd_question: "{explanation} Which accounts make up the audited cash and bank balance?"

  # --- Bank accounts (TC-24) ---
  - id: BA-01
    title: Declared accounts have statements
    finding_title: Declared account without a statement
    area: accounts
    variable: declared_accounts_with_statements
    sources: [existing_facilities_declaration, application_message, bank_statement]
    comparison: set_contains
    severity: moderate
    blocking: false
    explanation: "No statement is on file for the declared account(s) {items}."
    query: "Please provide 12 months' statements for {items}."

  - id: BA-02
    title: Accounts on file are declared
    finding_title: Account on file that was not declared
    area: accounts
    variable: evidenced_accounts_declared
    sources: [bank_statement, existing_facilities_declaration, application_message]
    comparison: set_contains
    severity: moderate
    blocking: false
    explanation: "{items}."
    query: "Please confirm whose account each of these is and why it was not declared, and provide 12 months' statements where missing: {accounts}."
    pd_question: "{explanation} Whose accounts are these, and what are they used for?"

  # --- Obligations (TC-25) ---
  - id: OB-01
    title: Declared facilities reconcile with sanction letters and the bureau
    finding_title: Existing facilities do not reconcile
    area: obligations
    variable: facilities_reconcile
    sources: [existing_facilities_declaration, sanction_letter, commercial_bureau_report, application_message]
    comparison: set_equal
    tolerance: facility_amount_match
    severity: serious
    blocking: false
    explanation: "The existing facilities do not reconcile: {items}."
    query: "Please reconcile the existing facilities ({lenders}): give each facility's lender, sanctioned amount and outstanding, with its sanction letter."
    pd_question: "{explanation} Which facilities does the company have today, and with whom?"

  - id: OB-02
    title: Instalments in bank statements go to declared lenders
    finding_title: Instalments to a lender that was not declared
    area: obligations
    variable: emis_to_declared_lenders
    sources: [bank_statement, existing_facilities_declaration, application_message]
    comparison: set_contains
    severity: serious
    blocking: false
    explanation: "Regular debits to lender(s) not declared: {items}."
    query: "Please give details of the facility with {lenders}: the amount, the outstanding and the instalment."
    pd_question: "{explanation} What are these payments for, and why were they not declared?"

  - id: OB-03
    title: Borrowings in the books are serviced in the bank
    finding_title: Borrowings and instalments do not match
    area: obligations
    variable: borrowings_serviced
    sources: [audited_financial_statements, bank_statement]
    comparison: presence
    severity: moderate
    blocking: false
    explanation: "{items}"
    query: "Please confirm how the company's term borrowings are repaid, and from which account."
    pd_question: "{explanation} Where are these loans serviced?"

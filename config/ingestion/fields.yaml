  # ---- Types added for the restructure (decision 14). The model reads each field and code checks it on its page.
  # Their tables, other than the provisional statements' (found by headings like the audited), are not read yet.
  provisional_financial_statements:
    extraction: model
    identity: {name: company_name}
    table_keywords:
      balance_sheet: {<<: *statement_table, part: balance_sheet}
      profit_and_loss: {<<: *statement_table, part: profit_and_loss}
      cash_flow: {<<: *statement_table, part: cash_flow, optional: true}   # a small company may file no cash flow
    fields:
      company_name: {llm_hint: 'the full legal name of the company whose statements these are, as printed'}
      period_from: {llm_hint: 'the first day of the period the statements cover, copied as printed; null if only the end is printed'}
      period_to: {llm_hint: 'the last day of the period the statements cover ("for the nine months ended 31 December 2025", "as at 31 December 2025"), copied as printed'}
      statement_basis: {llm_hint: 'the words that say these statements are provisional or unaudited, copied as printed from the title or a heading'}
      certified_by: {llm_hint: 'the firm or chartered accountant that certifies or prepared the statements, as printed; null if none'}
      certification_date: {llm_hint: 'the date the statements were certified or signed, copied as printed; null if none'}
      amount_unit: {llm: false, patterns: ['(?:amounts?|figures|values)?\s*(?:are\s+)?in\s+(?:INR|Rs\.?|₹)?\s*(thousands?|lakhs?|lacs?|crores?|millions?)\b', '(?:INR|Rs\.?|₹)\s*in\s+(thousands?|lakhs?|lacs?|crores?|millions?)\b']}

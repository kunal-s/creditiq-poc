page:
  admin:
    eyebrow: Administration
    title: Administration
    purpose: What the published configuration says and who may do what. Tolerances, policy norms, cross-check rules and the approval matrix are changed under Settings by an Administrator; every change is published as a new version.
    sections: Administration sections
  audit:
    eyebrow: Governance
    title: Audit trail
    purpose: Who did what, and when. Entries are added as work happens and are never changed.
  help:
    eyebrow: Help
    title: Guide to the steps
    purpose: What each step of an appraisal does, what the statuses mean and what is asked of you.
    stepsTitle: The steps
    statusTitle: What the statuses mean
    fileLabelsTitle: What the labels on a file mean
    fileLabel:
      integrity:
        title: "Integrity: checks passed, worth a look, stands out"
        body: What the file says about itself, checked before anything is read from it - its saves, its dates and makers; on pages of text, anything laid over the text, hidden, or set in another typeface; and on scans and photos, a patch with another grain, a value off its line, a text layer that says another number than the picture, a figure pasted as a picture, or a page made differently from the rest. It is a reason for a person to look, never proof of an edit, and it never rejects a document. Select the chip to see every check; "Open integrity view" shows the pages with each spot marked.
      integrityView:
        title: Integrity view
        body: The file's pages with every place a check points at drawn on them and labelled, beside what stands out, the fonts the file uses, and every check - applied, with nothing to look at, or not run for this kind of document - with the records each one read.
      track:
        title: "Received, Quality, Split, Classified, Extracted"
        body: The five steps each document inside a file goes through. A step shown in amber is waiting for a person, and the row says why.
      notIdentified:
        title: "Not identified · Needs a person: document type"
        body: The kind of document could not be decided with enough confidence. The row offers the nearest types to assign; picking one reads the file again as that type. Until a type is assigned the document is not counted against the checklist.
      different:
        title: Why a file can be clear and still need a person
        body: The integrity chip is about the file itself; the steps are about reading it. A file can be untouched (nothing stands out) and still have a type nobody could decide, or the other way round. Each label says which of the two it is about.
    step:
      documents:
        title: Files
        body: Every file you upload is checked for readability and identified as a kind of document. A file that cannot be read is sent back with a request for a clearer copy.
      extraction:
        title: Extracted data
        body: The figures and details printed on each document are read out and shown next to the page they came from. Check anything marked for review.
      completeness:
        title: Document readiness
        body: The documents received are compared with those the facility needs. What is missing, stale or incomplete is listed with the request to send to the customer.
      crossVerification:
        title: Cross-verification
        body: The same fact is compared across documents, for example a name or a turnover figure. Differences are listed with both values for you to accept or reject.
      policy:
        title: Financials and Policy
        body: The financial statements year by year and turnover from every source, then the application measured against each credit policy norm, with the required and the actual value side by side.
      outputs:
        title: Outputs
        body: The interim spread, the draft credit memo and the personal discussion questions, each figure linked to its source.
    status:
      not_started: The step has not begun, usually because an earlier step is still running.
      in_progress: The step is running now. It updates on its own.
      needs_attention: "Something needs a person: a document, a value or a decision."
      done: The step is complete.
